/* =====================================================================
   Sectie 11: KPI- en inzicht-berekeningen
   ===================================================================== */
function computeKpis(filtered){
  const now = new Date();
  const yearStart = new Date(Date.UTC(now.getUTCFullYear(),0,1));
  const last12 = new Date(now); last12.setUTCMonth(last12.getUTCMonth()-12);
  const prev12Start = new Date(now); prev12Start.setUTCMonth(prev12Start.getUTCMonth()-24);
  const monthStart = new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1));
  const prevMonthStart = new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-1,1));
  const quarterStart = new Date(Date.UTC(now.getUTCFullYear(), Math.floor(now.getUTCMonth()/3)*3, 1));
  const prevQuarterStart = new Date(Date.UTC(now.getUTCFullYear(), Math.floor(now.getUTCMonth()/3)*3-3, 1));
  const dataYTDprevYear = filtered.filter(r=> r.eersteToelating && r.eersteToelating.getUTCFullYear()===now.getUTCFullYear()-1 && r.eersteToelating <= new Date(Date.UTC(now.getUTCFullYear()-1, now.getUTCMonth(), now.getUTCDate())));
  const dataYTDthisYear = filtered.filter(r=> r.eersteToelating && r.eersteToelating>=yearStart);
  const laatste12mData = filtered.filter(r=> r.eersteToelating && r.eersteToelating>=last12);
  const vorige12mData = filtered.filter(r=> r.eersteToelating && r.eersteToelating>=prev12Start && r.eersteToelating<last12);
  const dezeMaand = filtered.filter(r=> r.eersteToelating && r.eersteToelating>=monthStart);
  const vorigeMaand = filtered.filter(r=> r.eersteToelating && r.eersteToelating>=prevMonthStart && r.eersteToelating<monthStart);
  const ditKwartaal = filtered.filter(r=> r.eersteToelating && r.eersteToelating>=quarterStart);
  const vorigKwartaal = filtered.filter(r=> r.eersteToelating && r.eersteToelating>=prevQuarterStart && r.eersteToelating<quarterStart);
  const uniqModels = new Set(filtered.map(r=> (r.brandId||"")+"|"+r.handelsbenaming.toUpperCase())).size;
  const withAge = filtered.filter(r=>r.leeftijd!=null);
  return {
    totaal: filtered.length,
    nieuwDitJaar: dataYTDthisYear.length,
    nieuwDitJaarDelta: fmtDelta(dataYTDthisYear.length, dataYTDprevYear.length),
    laatste12m: laatste12mData.length,
    laatste12mDelta: fmtDelta(laatste12mData.length, vorige12mData.length),
    dezeMaandDelta: fmtDelta(dezeMaand.length, vorigeMaand.length),
    ditKwartaalDelta: fmtDelta(ditKwartaal.length, vorigKwartaal.length),
    volvoCE: filtered.filter(r=>r.brandId==="VOLVO_CE").length,
    sennebogen: filtered.filter(r=>r.brandId==="SENNEBOGEN").length,
    concurrent: filtered.filter(r=>r.status==="Concurrent").length,
    elektrisch: filtered.filter(r=>r.elektrisch==="Ja").length,
    gemLeeftijd: avg(withAge.map(r=>r.leeftijd)),
    ouder10: filtered.filter(r=>r.leeftijd!=null && r.leeftijd>=STATE.settings.replacementAge).length,
    uniekeModellen: uniqModels,
  };
}
function generateInsights(filtered){
  const insights = [];
  const wielladers = filtered.filter(r=>r.productgroep==="Wielladers");
  if(wielladers.length>=8){
    const byBrand = groupBy(wielladers, r=>r.brandId);
    const volvo = (byBrand.get("VOLVO_CE")||[]).length;
    if(volvo>0){ insights.push("Volvo vertegenwoordigt "+fmtPct((volvo/wielladers.length)*100,1)+" van de geselecteerde RDW-registraties binnen wielladers in de gekozen periode."); }
  }
  const now = new Date();
  ["CAT","VOLVO_CE","SENNEBOGEN","LIEBHERR"].forEach(bid=>{
    const brand = brandById(bid); if(!brand) return;
    const thisYr = filtered.filter(r=>r.brandId===bid && r.jaar===now.getUTCFullYear()).length;
    const prevYr = filtered.filter(r=>r.brandId===bid && r.jaar===now.getUTCFullYear()-1).length;
    if(thisYr>=5 && prevYr>=5){
      const d = fmtDelta(thisYr, prevYr);
      if(d.dir!=="flat") insights.push("Het aantal registraties van "+brand.label+" ligt "+fmtPct(Math.abs(d.pct),0)+" "+(d.dir==="up"?"hoger":"lager")+" dan in dezelfde periode vorig jaar.");
    }
  });
  const senneb = filtered.filter(r=>r.brandId==="SENNEBOGEN");
  if(senneb.length>=8){
    const oud = senneb.filter(r=>r.leeftijd!=null && r.leeftijd>=STATE.settings.replacementAge).length;
    insights.push(fmtPct((oud/senneb.length)*100,0)+" van het geselecteerde Sennebogen-machinepark is ouder dan "+STATE.settings.replacementAge+" jaar.");
  }
  const thisYrAll = filtered.filter(r=>r.jaar===now.getUTCFullYear());
  const prevYrAll = filtered.filter(r=>r.jaar===now.getUTCFullYear()-1);
  if(thisYrAll.length>=15 && prevYrAll.length>=15){
    const pElecThis = (thisYrAll.filter(r=>r.elektrisch==="Ja").length/thisYrAll.length)*100;
    const pElecPrev = (prevYrAll.filter(r=>r.elektrisch==="Ja").length/prevYrAll.length)*100;
    insights.push("Het aandeel elektrische registraties is "+(pElecThis>=pElecPrev?"gestegen":"gedaald")+" van "+fmtPct(pElecPrev,1)+" naar "+fmtPct(pElecThis,1)+".");
  }
  if(insights.length===0) insights.push("Onvoldoende data binnen de huidige filterselectie voor betrouwbare inzichten. Verruim de selectie voor meer resultaten.");
  return insights.slice(0,4);
}

/* =====================================================================
   Sectie 12: Nieuwe modellen gesignaleerd (widget, sectie 17)
   ===================================================================== */
function detectUnknownModels(allRecords){
  const groups = groupBy(allRecords.filter(r=> r.confidence==="Laag" && r.brandId && !STATE.newDetectedAdded.has(r.merkRdw+"|"+r.handelsbenaming.toUpperCase())), r=> r.merkRdw+"|"+r.handelsbenaming.toUpperCase());
  const out = [];
  groups.forEach((recs, key)=>{
    if(recs.length<1) return;
    const [merk, model] = key.split("|");
    out.push({ merk, model: recs[0].handelsbenaming, count: recs.length, brandId: recs[0].brandId });
  });
  return out.sort((a,b)=>b.count-a.count).slice(0,6);
}
function renderNewModelsWidget(allRecords){
  const found = detectUnknownModels(allRecords);
  if(found.length===0) return "";
  return '<div class="card section">'+
    '<div class="card-title">Nieuwe modellen gesignaleerd</div>'+
    '<div class="card-sub">Handelsbenamingen die nog niet met hoge betrouwbaarheid in de modellenbibliotheek staan.</div>'+
    found.map(f=>{
      const brand = brandById(f.brandId);
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);">'+
        '<div><div style="font-weight:700;font-size:13px;">'+(brand?esc(brand.label)+" — ":"")+'nieuw mogelijk model</div>'+
        '<div style="font-size:12px;color:var(--text-secondary);">Handelsbenaming: <b>'+esc(f.model)+'</b> · '+f.count+' registratie'+(f.count===1?"":"s")+' gevonden</div></div>'+
        '<button class="btn btn-sm btn-accent" data-add-model="'+esc(f.merk)+"|"+esc(f.model)+'">Toevoegen aan classificatie</button>'+
      '</div>';
    }).join("")+
  '</div>';
}

      '<div><div class="kpi-note" style="margin-bottom:4px;">Deze maand vs vorige maand</div><div class="kpi-delta '+k.dezeMaandDelta.dir+'">'+k.dezeMaandDelta.text+'</div></div>'+
      '<div><div class="kpi-note" style="margin-bottom:4px;">Dit kwartaal vs vorig kwartaal</div><div class="kpi-delta '+k.ditKwartaalDelta.dir+'">'+k.ditKwartaalDelta.text+'</div></div>'+
      '<div><div class="kpi-note" style="margin-bottom:4px;">Dit jaar vs vorig jaar</div><div class="kpi-delta '+k.nieuwDitJaarDelta.dir+'">'+k.nieuwDitJaarDelta.text+'</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="grid grid-2 section">'+
    '<div class="card"><div class="card-title">Managementinzichten</div><div class="card-sub">Automatisch berekend uit de huidige selectie'+(STATE.mode==="demo"?" (demodata)":"")+'.</div>'+
      '<div class="insight-list">'+insights.map(t=>'<div class="insight"><span>▸</span><span>'+esc(t)+'</span></div>').join("")+'</div>'+
      disclaimerBlock()+
    '</div>'+
    renderNewModelsWidget(all)+
  '</div>'+
  aboutDataBlock();
}

/* =====================================================================
   Sectie 14: PAGINA — Marktontwikkeling
   ===================================================================== */
function renderMarktontwikkeling(filtered){
  const ui = STATE.ui;
  const gran = ui.marktontwGranularity;
  const top5 = ui.marktontwTop5;
  const keyFn = r=> gran==="jaar" ? String(r.jaar) : gran==="kwartaal" ? r.kwartaal : r.maand;
  let withKey = filtered.filter(r=> r.eersteToelating);
  if(top5){
    const cutoff = new Date(); cutoff.setUTCMonth(cutoff.getUTCMonth()-12);
    withKey = withKey.filter(r=> r.eersteToelating>=cutoff);
  }
  const allKeys = Array.from(new Set(withKey.map(keyFn))).filter(Boolean).sort();
  const xLabels = top5 ? allKeys : allKeys.slice(-24);
  // Top 10: rangschik merken op aantal registraties BINNEN de gekozen periode
  // (laatste 12 maanden), niet op totale historie — anders zou een merk met
  // veel oude registraties een recent actiever merk kunnen verdringen.
  const brandsToShow = top5
    ? BRANDS.map(b=>({ b, count: withKey.filter(r=>r.brandId===b.id).length }))
        .filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,10).map(x=>x.b)
    : BRANDS;
  const series = brandsToShow.map((b,i)=>{
    const recs = withKey.filter(r=>r.brandId===b.id);
    const byKey = groupBy(recs, keyFn);
    return { id:b.id, label:b.label, color:brandColor(b.id), dash:brandDashed(b.id), values: xLabels.map(x=> (byKey.get(x)||[]).length) };
  });
  const now = new Date();
  const curYr = now.getUTCFullYear();
  const curCount = filtered.filter(r=>r.jaar===curYr).length;
  const prevCount = filtered.filter(r=>r.jaar===curYr-1).length;
  const delta = fmtDelta(curCount, prevCount);
  return '<div class="page-head"><h2>Marktontwikkeling</h2><p>'+
    (top5 ? 'Top 10 merken (op registraties, laatste 12 maanden) per '+gran+'.' : 'Registraties per '+gran+' met vergelijking tussen merken.')+
    ' Zet merken aan of uit via de legenda.</p></div>'+
  '<div class="card section">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'+
        '<div class="pill-toggle" id="gran-toggle">'+
          ["maand","kwartaal","jaar"].map(g=>'<button data-gran="'+g+'" class="'+(gran===g?"active":"")+'">'+g.charAt(0).toUpperCase()+g.slice(1)+'</button>').join("")+
        '</div>'+
        '<div class="pill-toggle" id="top5-toggle">'+
          '<button data-top5="1" class="'+(top5?"active":"")+'">Top 10 · 12 mnd</button>'+
          '<button data-top5="0" class="'+(!top5?"active":"")+'">Alle merken</button>'+
        '</div>'+
      '</div>'+
      '<div style="display:flex;gap:18px;font-size:12.5px;">'+
        '<div><span style="color:var(--text-muted)">Huidig jaar (‘'+String(curYr).slice(2)+'):</span> <b class="tabular">'+fmtNum(curCount)+'</b></div>'+
        '<div><span style="color:var(--text-muted)">Vorig jaar:</span> <b class="tabular">'+fmtNum(prevCount)+'</b></div>'+
        '<div class="kpi-delta '+delta.dir+'" style="display:inline-flex;">'+delta.text+'</div>'+
      '</div>'+
    '</div>'+
    (series.length ? lineChart({ xLabels, series, offSet: ui.marktontwOffSeries, toggleAttr:"toggle-mo-series" }) : '<div class="empty-state">Geen registraties binnen de laatste 12 maanden voor de huidige selectie.</div>')+
  '</div>'+
  disclaimerBlock();
}

/* =====================================================================
   Sectie 15: PAGINA — Marktaandeel (RDW-registratieaandeel)
   ===================================================================== */
function renderMarktaandeel(filtered){
  const ui = STATE.ui;
  const groep = ui.marktaandeelGroep;
  const scoped = groep==="alle" ? filtered : filtered.filter(r=>r.productgroep===groep);
  const byBrand = groupBy(scoped, r=>r.brandId);
  let items = BRANDS.map(b=>({ id:b.id, label:b.label, value:(byBrand.get(b.id)||[]).length, color: brandColor(b.id) })).filter(i=>i.value>0);
  items.sort((a,b)=>b.value-a.value);
  const total = items.reduce((a,b)=>a+b.value,0);
  const top = items.slice(0,7);
  const rest = items.slice(7);
  const restSum = rest.reduce((a,b)=>a+b.value,0);
  const donutItems = restSum>0 ? top.concat([{id:"other",label:"Overig",value:restSum,color:"var(--s-other)"}]) : top;
  const now = new Date().getUTCFullYear();
  return '<div class="page-head"><h2>Marktaandeel</h2><p>Berekend uitsluitend op basis van de geselecteerde relevante RDW-registraties — daarom expliciet <b>RDW-registratieaandeel</b> genoemd, niet "marktaandeel".</p></div>'+
  '<div class="filterbar" style="position:static;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:16px;">'+
    '<label class="fgroup">Productgroep<select id="marktaandeel-groep">'+
      '<option value="alle" '+(groep==="alle"?"selected":"")+'>Alle productgroepen</option>'+
      PRODUCT_GROUPS.map(g=>'<option value="'+esc(g)+'" '+(groep===g?"selected":"")+'>'+esc(g)+'</option>').join("")+
    '</select></label>'+
  '</div>'+
  (total===0 ? '<div class="card empty-state">Geen registraties binnen deze selectie.</div>' :
  '<div class="grid grid-2 section">'+
    '<div class="card"><div class="card-title">RDW-registratieaandeel'+(groep!=="alle"?" — "+esc(groep):"")+'</div>'+
      '<div class="card-sub">Registraties '+now+' (binnen actieve filters), n='+fmtNum(total)+'</div>'+
      donutChart(donutItems)+
    '</div>'+
    '<div class="card"><div class="card-title">Ranglijst</div><div class="card-sub">Formule: registraties merk ÷ totaal geselecteerde registraties × 100</div>'+
      barChartH(items.map(i=>Object.assign({},i,{share:(i.value/total)*100})), {showShare:true})+
    '</div>'+
  '</div>'+
  '<div class="table-wrap section"><table><thead><tr><th>Merk</th><th>Registraties</th><th>RDW-registratieaandeel</th></tr></thead><tbody>'+
    items.map(i=>'<tr><td>'+esc(i.label)+'</td><td class="tabular">'+fmtNum(i.value)+'</td><td class="tabular">'+fmtPct((i.value/total)*100,1)+'</td></tr>').join("")+
  '</tbody></table></div>')+
  disclaimerBlock();
}

/* =====================================================================
   Sectie 16: PAGINA — Concurrentie
   ===================================================================== */
function renderConcurrentie(all){
  const ui = STATE.ui;
  const smtModels = Object.keys(COMPETITIVE_MATRIX);
  const selected = ui.concurrentieModel;
  const compModels = COMPETITIVE_MATRIX[selected] || [];
  function statsFor(matchFn){
    const recs = all.filter(matchFn);
    const now = new Date().getUTCFullYear();
    const thisYr = recs.filter(r=>r.jaar===now).length;
    const prevYr = recs.filter(r=>r.jaar===now-1).length;
    const withAge = recs.filter(r=>r.leeftijd!=null);
    const gem = avg(withAge.map(r=>r.leeftijd));
    const ouder10 = recs.filter(r=>r.leeftijd!=null && r.leeftijd>=STATE.settings.replacementAge).length;
    const elek = recs.filter(r=>r.elektrisch==="Ja").length;
    const laatste = recs.reduce((mx,r)=> (r.eersteToelating && (!mx||r.eersteToelating>mx)) ? r.eersteToelating : mx, null);
    return { n:recs.length, thisYr, prevYr, gem, ouder10, elek, laatste };
  }
  function rowFor(label, matchFn, isSmt){
    const s = statsFor(matchFn);
    return '<tr>'+
      '<td>'+(isSmt?'<b>'+esc(label)+'</b>':esc(label))+'</td>'+
      '<td class="tabular">'+fmtNum(s.n)+'</td>'+
      '<td class="tabular">'+fmtNum(s.thisYr)+'</td>'+
      '<td class="tabular">'+fmtNum(s.prevYr)+'</td>'+
      '<td class="tabular">'+(s.gem!=null?fmtDec(s.gem,1)+" jr":"—")+'</td>'+
      '<td class="tabular">'+fmtNum(s.ouder10)+'</td>'+
      '<td class="tabular">'+fmtNum(s.elek)+'</td>'+
      '<td>'+(s.laatste?formatDateNL(s.laatste,true):"—")+'</td>'+
    '</tr>';
  }
  const [smtMerk, ...rest] = selected.split(" ");
  const smtModelKey = selected.replace(/^\S+\s/, "");
  const rows = rowFor(selected, r=> (r.merkRdw===smtMerk) && r.handelsbenaming.toUpperCase().startsWith(smtModelKey.split(" ")[0].replace(/[A-Z]$/,"")), true) +
    compModels.map(cm=>{
      const [cMerk, ...cModelParts] = cm.split(" ");
      const cModel = cModelParts.join(" ");
      return rowFor(cm, r=> r.merkRdw===cMerk && r.handelsbenaming.toUpperCase().startsWith(cModel), false);
    }).join("");
  return '<div class="page-head"><h2>Concurrentie</h2><p>Selecteer een eigen-merk-model om de handmatig samengestelde concurrentiematrix te vergelijken op registraties, leeftijd en elektrificatie.</p></div>'+
  '<div class="filterbar" style="position:static;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:16px;">'+
    '<label class="fgroup">Eigen model<select id="concurrentie-model">'+
      smtModels.map(m=>'<option value="'+esc(m)+'" '+(m===selected?"selected":"")+'>'+esc(m)+'</option>').join("")+
    '</select></label>'+
  '</div>'+
  '<div class="card section"><div class="card-title">'+esc(selected)+' — vergelijkbaar met</div>'+
    '<div class="card-sub">'+(compModels.length?compModels.join(" · "):"Nog geen concurrentiemodellen gekoppeld voor dit model.")+'</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Model</th><th>Registraties</th><th>Dit jaar</th><th>Vorig jaar</th><th>Gem. leeftijd</th><th>10+ jaar</th><th>Elektrisch</th><th>Laatst geregistreerd</th></tr></thead><tbody>'+
      rows+
    '</tbody></table></div>'+
  '</div>'+
  '<div class="card-sub" style="margin-bottom:8px;">De concurrentiematrix is in versie 1 handmatig samengesteld in de code en kan eenvoudig worden uitgebreid.</div>'+
  disclaimerBlock();
}

/* =====================================================================
   Sectie 17: PAGINA — Machinepark (leeftijd)
   ===================================================================== */
function renderMachinepark(filtered){
  const grens = STATE.ui.machineparkGrensLeeftijd;
  const withAge = filtered.filter(r=>r.leeftijd!=null);
  const cats = AGE_BUCKETS.map(b=>b.label.replace("tot","–"));
  const topBrands = ["VOLVO_CE","SENNEBOGEN","CAT","LIEBHERR","KOMATSU"];
  const series = topBrands.map(bid=>{
    const b = brandById(bid);
    const recs = withAge.filter(r=>r.brandId===bid);
    return { id:bid, label:b.label, color:brandColor(bid), values: AGE_BUCKETS.map(bk=> recs.filter(r=>r.leeftijdscategorie===bk.id).length) };
  });
  const histAll = AGE_BUCKETS.map(bk=> withAge.filter(r=>r.leeftijdscategorie===bk.id).length);
  const potentieel = withAge.filter(r=>r.leeftijd>=grens);
  const byBrandTable = groupBy(withAge, r=>r.brandId);
  const brandRows = BRANDS.filter(b=> (byBrandTable.get(b.id)||[]).length>0).map(b=>{
    const recs = byBrandTable.get(b.id)||[];
    const gem = avg(recs.map(r=>r.leeftijd));
    const ouder = recs.filter(r=>r.leeftijd>=grens).length;
    return '<tr><td>'+esc(b.label)+'</td><td class="tabular">'+fmtNum(recs.length)+'</td><td class="tabular">'+fmtDec(gem,1)+' jr</td>'+
      '<td class="tabular">'+fmtNum(ouder)+'</td><td class="tabular">'+fmtPct((ouder/recs.length)*100,1)+'</td></tr>';
  }).join("");
  return '<div class="page-head"><h2>Machinepark</h2><p>Leeftijdsopbouw van het geregistreerde machinepark per merk, met instelbare vervangingsgrens.</p></div>'+
  '<div class="card section">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:6px;">'+
      '<div class="card-title" style="margin-bottom:0;">Leeftijdsopbouw per merk</div>'+
      '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);">Vervangingsgrens: '+
        '<div class="pill-toggle" id="grens-toggle">'+[8,10,12,15].map(g=>'<button data-grens="'+g+'" class="'+(grens===g?"active":"")+'">'+g+' jr</button>').join("")+'</div>'+
      '</div>'+
    '</div>'+
    stackedBarChart(cats, series)+
  '</div>'+
  '<div class="grid grid-2 section">'+
    '<div class="card"><div class="card-title">Histogram — totale populatie</div>'+
      stackedBarChart(cats, [{id:"all",label:"Alle merken",color:"var(--brand)",values:histAll}])+
    '</div>'+
    '<div class="card"><div class="card-title">Indicatief vervangingspotentieel</div>'+
      '<div class="card-sub">Machines van '+grens+' jaar of ouder binnen de huidige selectie. Dit is een indicatie op basis van leeftijd — geen sales leads en geen weergave van daadwerkelijke vervangingsintentie.</div>'+
      '<div class="kpi-value" style="margin:6px 0 2px;">'+fmtNum(potentieel.length)+'</div>'+
      '<div class="kpi-note">'+(withAge.length?fmtPct((potentieel.length/withAge.length)*100,1):'—')+' van machines met bekende leeftijd binnen selectie</div>'+
    '</div>'+
  '</div>'+
  '<div class="table-wrap section"><table><thead><tr><th>Merk</th><th>Aantal</th><th>Gem. leeftijd</th><th>'+grens+'+ jaar</th><th>Aandeel '+grens+'+</th></tr></thead><tbody>'+brandRows+'</tbody></table></div>'+
  disclaimerBlock();
}

/* =====================================================================
   Sectie 18: PAGINA — Elektrificatie
   ===================================================================== */
function renderElektrificatie(filtered){
  const total = filtered.length;
  const elekJa = filtered.filter(r=>r.elektrisch==="Ja");
  const elekHyb = filtered.filter(r=>r.elektrisch==="Hybride");
  const diesel = filtered.filter(r=>r.elektrisch==="Nee");
  const onbekend = filtered.filter(r=>r.elektrisch==="Onbekend");
  const now = new Date().getUTCFullYear();
  const years = Array.from({length:5},(_,i)=> now-4+i);
  const perJaar = years.map(y=> filtered.filter(r=>r.jaar===y && r.elektrisch==="Ja").length);
  const perJaarTotal = years.map(y=> filtered.filter(r=>r.jaar===y).length);
  const aandeelSeries = [{ id:"elek", label:"Aandeel elektrisch (%)", color:"var(--s2)", values: perJaarTotal.map((t,i)=> t? +( (perJaar[i]/t)*100 ).toFixed(1) : null) }];
  const perFabrikant = groupBy(elekJa, r=>r.brandId);
  const fabItems = BRANDS.filter(b=>(perFabrikant.get(b.id)||[]).length>0)
    .map(b=>({ id:b.id, label:b.label, value:(perFabrikant.get(b.id)||[]).length, color:brandColor(b.id) }))
    .sort((a,b)=>b.value-a.value);
  const modellen = Array.from(new Set(elekJa.map(r=>r.handelsbenaming))).slice(0,14);
  const lowData = total < 25;
  return '<div class="page-head"><h2>Elektrificatie</h2><p>Ontwikkeling van elektrische en hybride registraties binnen eigen merken en concurrentmerken.</p></div>'+
  (lowData ? '<div class="info-block section"><span>⚠</span><div><b>Beperkte datagrondslag.</b> De huidige selectie bevat weinig registraties ('+fmtNum(total)+'); percentages en trends zijn hierdoor minder betrouwbaar.</div></div>' : '')+
  '<div class="grid grid-kpi section">'+
    kpiCard("Elektrische machines", fmtNum(elekJa.length))+
    kpiCard("Aandeel elektrisch", total?fmtPct((elekJa.length/total)*100,1):"—")+
    kpiCard("Hybride machines", fmtNum(elekHyb.length))+
    kpiCard("Onbekende aandrijving", fmtNum(onbekend.length), "RDW-data onvoldoende eenduidig")+
  '</div>'+
  '<div class="grid grid-2 section">'+
    '<div class="card"><div class="card-title">Aandrijving — verdeling</div>'+
      donutChart([
        {id:"e",label:"Elektrisch",value:elekJa.length,color:"var(--s2)"},
        {id:"h",label:"Hybride",value:elekHyb.length,color:"var(--s3)"},
        {id:"d",label:"Diesel",value:diesel.length,color:"var(--s-other)"},
        {id:"o",label:"Onbekend",value:onbekend.length,color:"var(--text-muted)"},
      ].filter(i=>i.value>0))+
    '</div>'+
    '<div class="card"><div class="card-title">Aandeel elektrisch per fabrikant</div>'+
      (fabItems.length? barChartH(fabItems) : '<div class="empty-state">Geen elektrische registraties binnen selectie.</div>')+
    '</div>'+
  '</div>'+
  '<div class="card section"><div class="card-title">Ontwikkeling laatste 5 jaar</div><div class="card-sub">Aandeel elektrische registraties per jaar (%)</div>'+
    lineChart({ xLabels: years.map(String), series: aandeelSeries, valueFmt:v=>fmtPct(v,1) })+
  '</div>'+
  '<div class="card section"><div class="card-title">Elektrische modellen in selectie</div>'+
    (modellen.length ? '<div style="display:flex;flex-wrap:wrap;gap:7px;">'+modellen.map(m=>'<span class="badge badge-good">'+esc(m)+'</span>').join("")+'</div>' : '<div class="empty-state">Geen elektrische modellen gevonden binnen selectie.</div>')+
  '</div>'+
  disclaimerBlock();
}

/* =====================================================================
   Sectie 19: PAGINA — Nieuwe registraties
   ===================================================================== */
const NIEUWE_REG_PAGE_SIZE = 150;
function renderNieuweRegistraties(filtered){
  const ui = STATE.ui;
  const per = ui.nieuweRegPeriode;
  const now = new Date();
  let cutoff = null;
  if(per==="7"){ cutoff=new Date(now); cutoff.setUTCDate(cutoff.getUTCDate()-7); }
  else if(per==="30"){ cutoff=new Date(now); cutoff.setUTCDate(cutoff.getUTCDate()-30); }
  else if(per==="90"){ cutoff=new Date(now); cutoff.setUTCDate(cutoff.getUTCDate()-90); }
  else if(per==="jaar"){ cutoff=new Date(Date.UTC(now.getUTCFullYear(),0,1)); }
  let recs = filtered.filter(r=>r.eersteToelating).sort((a,b)=>b.eersteToelating-a.eersteToelating);
  if(cutoff) recs = recs.filter(r=>r.eersteToelating>=cutoff);
  // Vorige versie toonde altijd alleen de nieuwste 150 zonder paginering — bij
  // "Dit jaar" met meerdere actieve merken overschrijden alleen al de laatste
  // paar maanden die 150 ruimschoots, waardoor eerdere maanden (bv. jan/feb/mrt)
  // volledig onzichtbaar bleven, ook al bevatte de dataset ze wél.
  const totalPages = Math.max(1, Math.ceil(recs.length/NIEUWE_REG_PAGE_SIZE));
  const page = Math.min(ui.nieuweRegPage, totalPages);
  const shown = recs.slice((page-1)*NIEUWE_REG_PAGE_SIZE, page*NIEUWE_REG_PAGE_SIZE);
  return '<div class="page-head"><h2>Nieuwe registraties</h2><p>Meest recente relevante RDW-registraties, standaard nieuwste eerst.</p></div>'+
  '<div class="filterbar" style="position:static;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:16px;">'+
    '<div class="pill-toggle" id="nieuw-periode">'+
      [["7","7 dagen"],["30","30 dagen"],["90","90 dagen"],["jaar","Dit jaar"]].map(([v,l])=>'<button data-nperiode="'+v+'" class="'+(per===v?"active":"")+'">'+l+'</button>').join("")+
    '</div>'+
    '<span style="margin-left:auto;font-size:12px;color:var(--text-muted);">'+fmtNum(recs.length)+' resultaten</span>'+
  '</div>'+
  '<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Kenteken</th><th>Merk</th><th>Model</th><th>Productgroep</th><th>Brandstof</th><th>Elektrisch</th><th>Leeftijd</th><th>Status</th></tr></thead><tbody>'+
    (shown.length ? shown.map(r=>{
      const b = brandById(r.brandId);
      return '<tr data-open-detail="'+esc(r.kenteken)+'"><td>'+(r.eersteToelating?formatDateNL(r.eersteToelating,true):"—")+importInfoIcon(r)+'</td>'+
        '<td class="mono">'+esc(r.kenteken)+'</td><td>'+esc(b?b.label:r.merkRdw)+'</td><td>'+esc(r.handelsbenaming)+'</td>'+
        '<td>'+esc(r.productgroep)+'</td><td>'+esc(r.brandstof)+'</td><td>'+elekBadge(r.elektrisch)+'</td>'+
        '<td class="tabular">'+(r.leeftijd!=null?r.leeftijd+" jr":"—")+'</td><td>'+statusBadge(r.status)+'</td></tr>';
    }).join("") : '<tr><td colspan="9"><div class="empty-state">Geen registraties gevonden binnen de gekozen periode en filters.</div></td></tr>')+
  '</tbody></table>'+
  '<div class="pagination"><button class="btn btn-sm" id="nieuw-reg-prev" '+(page<=1?"disabled":"")+'>← Vorige</button>'+
    '<span>Pagina '+page+' van '+totalPages+' ('+fmtNum(recs.length)+' resultaten)</span>'+
    '<button class="btn btn-sm" id="nieuw-reg-next" '+(page>=totalPages?"disabled":"")+'>Volgende →</button></div>'+
  '</div>'+
  '<div style="margin-top:14px;">'+disclaimerBlock()+'</div>';
}

/* =====================================================================
   Sectie 20: PAGINA — Voertuigen (zoeken, sorteren, pagineren)
   ===================================================================== */
const VOERTUIGEN_PAGE_SIZE = 25;
function renderVoertuigen(filtered){
  const ui = STATE.ui;
  let recs = filtered.slice();
  if(ui.voertuigenSearch){
    const q = ui.voertuigenSearch.toUpperCase();
    recs = recs.filter(r=> r.kenteken.includes(q) || r.merkRdw.includes(q) || r.handelsbenaming.toUpperCase().includes(q));
  }
  const { col, dir } = ui.voertuigenSort;
  const getVal = r=>{
    if(col==="merk") return brandById(r.brandId)?brandById(r.brandId).label:r.merkRdw;
    if(col==="handelsbenaming") return r.handelsbenaming;
    if(col==="productgroep") return r.productgroep;
    if(col==="eersteToelating") return r.eersteToelating?r.eersteToelating.getTime():0;
    if(col==="tenaamstelling") return r.tenaamstelling?r.tenaamstelling.getTime():0;
    if(col==="leeftijd") return r.leeftijd==null?-1:r.leeftijd;
    if(col==="brandstof") return r.brandstof;
    if(col==="elektrisch") return r.elektrisch;
    if(col==="massa") return r.massa==null?-1:r.massa;
    if(col==="confidence") return {Hoog:3,Middel:2,Laag:1}[r.confidence]||0;
    return r.kenteken;
  };
  recs.sort((a,b)=>{ const av=getVal(a), bv=getVal(b); const cmp = av<bv?-1:av>bv?1:0; return dir==="asc"?cmp:-cmp; });
  const totalPages = Math.max(1, Math.ceil(recs.length/VOERTUIGEN_PAGE_SIZE));
  const page = Math.min(ui.voertuigenPage, totalPages);
  const pageRecs = recs.slice((page-1)*VOERTUIGEN_PAGE_SIZE, page*VOERTUIGEN_PAGE_SIZE);
  const cols = [
    ["kenteken","Kenteken"],["merk","Merk"],["handelsbenaming","Handelsbenaming"],["productgroep","Productgroep"],
    ["eersteToelating","Eerste toelating"],["tenaamstelling","Tenaamstelling"],["leeftijd","Leeftijd"],
    ["brandstof","Brandstof"],["elektrisch","Elektrisch"],["massa","Massa rijklaar"],["confidence","Classificatiescore"],
  ];
  const arrow = c => col===c ? (dir==="asc"?" ▲":" ▼") : "";
  return '<div class="page-head"><h2>Voertuigen</h2><p>Doorzoekbaar en sorteerbaar overzicht van alle geclassificeerde registraties binnen de actieve filters.</p></div>'+
  '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">'+
    '<div class="search-input" style="max-width:340px;flex:1;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'+
      '<input type="text" id="voertuigen-search" placeholder="Zoek op kenteken, merk, model of handelsbenaming…" value="'+esc(ui.voertuigenSearch)+'"/></div>'+
    '<div style="display:flex;gap:8px;align-items:center;">'+
      '<span style="font-size:12px;color:var(--text-muted);">'+fmtNum(recs.length)+' resultaten</span>'+
      '<button class="btn btn-accent btn-sm" id="export-csv-voertuigen"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>Exporteren</button>'+
    '</div>'+
  '</div>'+
  '<div class="table-wrap"><table><thead><tr>'+cols.map(([c,l])=>'<th data-sort-col="'+c+'">'+l+arrow(c)+'</th>').join("")+'</tr></thead><tbody>'+
    (pageRecs.length ? pageRecs.map(r=>{
      const b = brandById(r.brandId);
      return '<tr data-open-detail="'+esc(r.kenteken)+'"><td class="mono">'+esc(r.kenteken)+'</td><td>'+esc(b?b.label:r.merkRdw)+'</td>'+
        '<td>'+esc(r.handelsbenaming)+'</td><td>'+esc(r.productgroep)+'</td>'+
        '<td>'+(r.eersteToelating?formatDateNL(r.eersteToelating,true):"—")+importInfoIcon(r)+'</td>'+
        '<td>'+(r.tenaamstelling?formatDateNL(r.tenaamstelling,true):"—")+'</td>'+
        '<td class="tabular">'+(r.leeftijd!=null?r.leeftijd+" jr":"—")+'</td>'+
        '<td>'+esc(r.brandstof)+'</td><td>'+elekBadge(r.elektrisch)+'</td>'+
        '<td class="tabular">'+(r.massa!=null?fmtNum(r.massa)+" kg"+massaBronIcon(r):'<span class="notavail">onbekend</span>')+'</td>'+
        '<td>'+confBadge(r.confidence)+'</td></tr>';
    }).join("") : '<tr><td colspan="11"><div class="empty-state">Geen voertuigen gevonden. Pas de zoekopdracht of filters aan.</div></td></tr>')+
  '</tbody></table>'+
  '<div class="pagination"><button class="btn btn-sm" id="voertuigen-prev" '+(page<=1?"disabled":"")+'>← Vorige</button>'+
    '<span>Pagina '+page+' van '+totalPages+'</span>'+
    '<button class="btn btn-sm" id="voertuigen-next" '+(page>=totalPages?"disabled":"")+'>Volgende →</button></div>'+
  '</div>';
}

/* =====================================================================
   Sectie 22: PAGINA — Datakwaliteit
   ===================================================================== */
function renderDatakwaliteit(all, filtered){
  const relevant = all.filter(r=>r.brandId);
  const excluded = all.length - relevant.length;
  const byConf = groupBy(relevant, r=>r.confidence);
  const hoog = (byConf.get("Hoog")||[]).length, middel=(byConf.get("Middel")||[]).length, laag=(byConf.get("Laag")||[]).length;
  const onbekendeModellen = detectUnknownModels(all).length;
  const missing = {
    massa: relevant.filter(r=>!r.massa).length,
    brandstof: relevant.filter(r=>r.brandstof==="Onbekend"||!r.brandstof).length,
    toelating: relevant.filter(r=>!r.eersteToelating).length,
  };
  const pct = n => relevant.length? fmtPct((n/relevant.length)*100,1) : "—";
  return '<div class="page-head"><h2>Datakwaliteit</h2><p>RDW-data is oorspronkelijk voertuigregistratiedata, geen specifieke marktdatabase voor bouwmachines. Dit overzicht maakt zichtbaar hoe betrouwbaar de analyses op basis hiervan zijn.</p></div>'+
  '<div class="grid grid-kpi section">'+
    kpiCard("Totaal opgehaald", fmtNum(all.length))+
    kpiCard("Relevant geclassificeerd", fmtNum(relevant.length), pct(relevant.length)+" van totaal")+
    kpiCard("Uitgesloten (onherkend merk)", fmtNum(excluded))+
    kpiCard("Classificatie hoog", fmtNum(hoog), pct(hoog))+
    kpiCard("Classificatie middel", fmtNum(middel), pct(middel))+
    kpiCard("Classificatie laag", fmtNum(laag), pct(laag))+
    kpiCard("Onbekende modellen gesignaleerd", fmtNum(onbekendeModellen))+
    kpiCard("Ontbrekende massa", fmtNum(missing.massa), pct(missing.massa))+
  '</div>'+
  '<div class="card section"><div class="card-title">Classificatiebetrouwbaarheid — verdeling</div>'+
    donutChart([
      {id:"h",label:"Hoog — exact model herkend",value:hoog,color:"var(--good)"},
      {id:"m",label:"Middel — modelreeks herkend, uitvoering onzeker",value:middel,color:"var(--warning)"},
      {id:"l",label:"Laag — alleen merk/gedeeltelijke naam herkend",value:laag,color:"var(--critical)"},
    ].filter(i=>i.value>0))+
  '</div>'+
  '<div class="card section"><div class="card-title">Ontbrekende waarden</div>'+
    '<div class="stat-row"><span>Massa rijklaar ontbreekt</span><b class="tabular">'+fmtNum(missing.massa)+' ('+pct(missing.massa)+')</b></div>'+
    '<div class="stat-row"><span>Brandstofomschrijving onbekend</span><b class="tabular">'+fmtNum(missing.brandstof)+' ('+pct(missing.brandstof)+')</b></div>'+
    '<div class="stat-row"><span>Datum eerste toelating ontbreekt</span><b class="tabular">'+fmtNum(missing.toelating)+' ('+pct(missing.toelating)+')</b></div>'+
  '</div>'+
  aboutDataBlock();
}

    '<label class="fgroup">Jaar<select id="f-jaar">'+
      '<option value="alle" '+(f.jaar==="alle"?"selected":"")+'>Alle jaren</option>'+
      Array.from({length:16},(_,i)=>new Date().getUTCFullYear()-i).map(y=>'<option value="'+y+'" '+(String(f.jaar)===String(y)?"selected":"")+'>'+y+'</option>').join("")+
    '</select></label>'+
    '<label class="fgroup">Merk<select id="f-merk">'+
      '<option value="alle" '+(!f.merkIds.length?"selected":"")+'>Alle merken</option>'+
      activeBrands.map(b=>'<option value="'+b.id+'" '+(f.merkIds[0]===b.id?"selected":"")+'>'+esc(b.label)+'</option>').join("")+
    '</select></label>'+
    '<label class="fgroup">Eigen merk/concurrent<select id="f-smtconc">'+
      [["alle","Alle"],["SMT","Eigen merk"],["Concurrent","Concurrent"]].map(([v,l])=>'<option value="'+v+'" '+(f.smtConcurrent===v?"selected":"")+'>'+l+'</option>').join("")+
    '</select></label>'+
    '<label class="fgroup">Productgroep<select id="f-groep">'+
      '<option value="alle" '+(f.productgroep==="alle"?"selected":"")+'>Alle groepen</option>'+
      PRODUCT_GROUPS.map(g=>'<option value="'+esc(g)+'" '+(f.productgroep===g?"selected":"")+'>'+esc(g)+'</option>').join("")+
    '</select></label>'+
    '<label class="fgroup">Model<input type="text" id="f-model" placeholder="bv. L120" value="'+esc(f.modelQuery)+'" style="width:88px;"/></label>'+
    '<label class="fgroup">Brandstof<select id="f-brandstof">'+
      '<option value="alle" '+(f.brandstof==="alle"?"selected":"")+'>Alle</option>'+
      ["Diesel","Elektrisch","Hybride (Diesel/Elektrisch)","Onbekend"].map(b=>'<option value="'+esc(b)+'" '+(f.brandstof===b?"selected":"")+'>'+esc(b)+'</option>').join("")+
    '</select></label>'+
    '<label class="fgroup">Elektrisch<select id="f-elek">'+
      [["alle","Alle"],["Ja","Ja"],["Nee","Nee"],["Hybride","Hybride"],["Onbekend","Onbekend"]].map(([v,l])=>'<option value="'+v+'" '+(f.elektrisch===v?"selected":"")+'>'+l+'</option>').join("")+
    '</select></label>'+
    '<label class="fgroup">Leeftijd<select id="f-leeftijd">'+
      '<option value="alle" '+(f.leeftijdscategorie==="alle"?"selected":"")+'>Alle</option>'+
      AGE_BUCKETS.map(b=>'<option value="'+b.id+'" '+(f.leeftijdscategorie===b.id?"selected":"")+'>'+esc(b.label)+'</option>').join("")+
    '</select></label>'+
    '<label class="fgroup">Betrouwbaarheid<select id="f-conf">'+
      [["alle","Alle"],["Hoog","Hoog"],["Middel","Middel"],["Laag","Laag"]].map(([v,l])=>'<option value="'+v+'" '+(f.betrouwbaarheid===v?"selected":"")+'>'+l+'</option>').join("")+
    '</select></label>'+
    (n>0 ? '<span class="filter-chip">'+n+' actief<button id="clear-filters" style="background:none;border:none;color:inherit;cursor:pointer;font-weight:700;padding:0;margin-left:2px;">✕</button></span>' : '<button class="btn btn-sm" id="clear-filters" style="opacity:.6;">Filters wissen</button>')+
  '</div>';
}

function pageBody(filtered, all){
  switch(STATE.page){
    case "dashboard": return renderDashboard(filtered, all);
    case "marktontwikkeling": return renderMarktontwikkeling(filtered);
    case "marktaandeel": return renderMarktaandeel(filtered);
    case "concurrentie": return renderConcurrentie(all);
    case "machinepark": return renderMachinepark(filtered);
    case "elektrificatie": return renderElektrificatie(filtered);
    case "nieuweregistraties": return renderNieuweRegistraties(filtered);
    case "voertuigen": return renderVoertuigen(filtered);
    case "datakwaliteit": return renderDatakwaliteit(all, filtered);
    case "instellingen": return renderInstellingen();
    default: return '<div class="empty-state">Onbekende pagina.</div>';
  }
}

function render(){
  applyTheme();
  const all = STATE.data;
  const filtered = applyFilters(all);
  const app = document.getElementById("app");
  app.innerHTML =
    renderSidebar() +
    '<div class="main">'+
      '<div class="topbar"><h1>'+esc(PAGE_TITLES[STATE.page]||"")+'</h1>'+
        '<div class="topbar-right">'+
          (STATE.loading ? '<span class="loading" style="padding:0;"><span class="spinner"></span>Laden…</span>' : '')+
          modeBanner()+
          '<button class="btn btn-sm" id="btn-export"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>Exporteren</button>'+
        '</div>'+
      '</div>'+
      renderFilterBar()+
      '<div class="content">'+
        (STATE.liveError ? '<div class="info-block section" style="border-color:var(--critical);background:var(--critical-tint);"><span>⚠</span><div><b>LIVE RDW niet beschikbaar.</b> '+esc(STATE.liveError)+' De applicatie toont daarom DEMODATA. Zie Instellingen → API-diagnostiek voor details.</div></div>' : '')+
        pageBody(filtered, all)+
      '</div>'+
    '</div>'+
    renderDetailModal(all);
  wireTooltips();
  wireEvents();
}

/* =====================================================================
   Sectie 25: event delegation
   ===================================================================== */
function goPage(p){ STATE.page=p; STATE.detailRecord=null; STATE.sidebarOpen=false; render(); window.scrollTo(0,0); }

async function loadLiveData(){
  STATE.mode="live"; STATE.loading=true; STATE.liveError=null; render();
  const brands = activeBrandList();
  const results = await fetchAllActiveLive(brands, (brand,r)=>{ STATE.liveDiag[brand.aliases[0]]=r; });
  const okResults = results.filter(r=>r.ok && r.records.length);
  if(okResults.length===0){
    const firstErr = results.find(r=>!r.ok);
    STATE.liveError = firstErr ? firstErr.error : "Geen resultaten ontvangen van RDW Open Data.";
    STATE.mode="demo";
    STATE.data = generateDemoDataset();
  } else {
    let combined = [];
    results.forEach(r=>{ if(r.ok) combined = combined.concat(r.records); });
    STATE.data = dedupeRecords(combined);
    if(okResults.length < results.length){
      STATE.liveError = "Sommige merken konden niet worden opgehaald; getoonde data is gedeeltelijk LIVE RDW.";
    }
  }
  STATE.loading=false; render();
}

async function toggleMode(){
  if(STATE.mode==="demo"){
    await loadLiveData();
  } else {
    STATE.mode="demo"; STATE.liveError=null; STATE.data = generateDemoDataset(); render();
  }
}

async function runDiagTest(merk){
  STATE.ui.diagRunning = true; render();
  const r = await fetchRdwBrand(merk, {});
  STATE.liveDiag[merk] = r;
  STATE.ui.diagRunning = false; render();
}

function wireEvents(){
  const app = document.getElementById("app");
  app.querySelectorAll("[data-nav]").forEach(el=> el.addEventListener("click", ()=> goPage(el.getAttribute("data-nav"))));
  const modeToggle = document.getElementById("mode-toggle");
  if(modeToggle) modeToggle.addEventListener("click", toggleMode);

  const exportBtn = document.getElementById("btn-export");
  if(exportBtn) exportBtn.addEventListener("click", ()=> exportCSV(applyFilters(STATE.data), "smt-market-intelligence-export.csv"));
  const exportBtn2 = document.getElementById("export-csv-voertuigen");
  if(exportBtn2) exportBtn2.addEventListener("click", ()=> exportCSV(applyFilters(STATE.data), "smt-voertuigen-export.csv"));

  // filters
  const bind = (id, fn) => { const el=document.getElementById(id); if(el) el.addEventListener("change", fn); };
  bind("f-periode", e=>{ STATE.filters.periodePreset=e.target.value; render(); });
  bind("f-jaar", e=>{ STATE.filters.jaar=e.target.value; render(); });
  bind("f-merk", e=>{ STATE.filters.merkIds = e.target.value==="alle" ? [] : [e.target.value]; render(); });
  bind("f-smtconc", e=>{ STATE.filters.smtConcurrent=e.target.value; render(); });
  bind("f-groep", e=>{ STATE.filters.productgroep=e.target.value; render(); });
  bind("f-brandstof", e=>{ STATE.filters.brandstof=e.target.value; render(); });
  bind("f-elek", e=>{ STATE.filters.elektrisch=e.target.value; render(); });
  bind("f-leeftijd", e=>{ STATE.filters.leeftijdscategorie=e.target.value; render(); });
  bind("f-conf", e=>{ STATE.filters.betrouwbaarheid=e.target.value; render(); });
  const modelInput = document.getElementById("f-model");
  if(modelInput){
    let t; modelInput.addEventListener("input", e=>{ clearTimeout(t); const v=e.target.value; t=setTimeout(()=>{ STATE.filters.modelQuery=v; render(); document.getElementById("f-model").focus(); },350); });
  }
  const clearBtn = document.getElementById("clear-filters");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ clearFilters(); render(); });

  // marktontwikkeling
  app.querySelectorAll("[data-gran]").forEach(el=> el.addEventListener("click", ()=>{ STATE.ui.marktontwGranularity=el.getAttribute("data-gran"); render(); }));
  app.querySelectorAll("[data-top5]").forEach(el=> el.addEventListener("click", ()=>{ STATE.ui.marktontwTop5=el.getAttribute("data-top5")==="1"; render(); }));
  app.querySelectorAll("[data-toggle-mo-series]").forEach(el=> el.addEventListener("click", ()=>{
    const id = el.getAttribute("data-toggle-mo-series");
    const set = STATE.ui.marktontwOffSeries;
    if(set.has(id)) set.delete(id); else set.add(id);
    render();
  }));

  // marktaandeel
  bind("marktaandeel-groep", e=>{ STATE.ui.marktaandeelGroep=e.target.value; render(); });

  // concurrentie
  bind("concurrentie-model", e=>{ STATE.ui.concurrentieModel=e.target.value; render(); });

  // machinepark grens
  app.querySelectorAll("[data-grens]").forEach(el=> el.addEventListener("click", ()=>{ STATE.ui.machineparkGrensLeeftijd=+el.getAttribute("data-grens"); render(); }));

  // nieuwe registraties periode
  app.querySelectorAll("[data-nperiode]").forEach(el=> el.addEventListener("click", ()=>{ STATE.ui.nieuweRegPeriode=el.getAttribute("data-nperiode"); STATE.ui.nieuweRegPage=1; render(); }));
  const nrPrev = document.getElementById("nieuw-reg-prev"); if(nrPrev) nrPrev.addEventListener("click", ()=>{ STATE.ui.nieuweRegPage=Math.max(1,STATE.ui.nieuweRegPage-1); render(); });
  const nrNext = document.getElementById("nieuw-reg-next"); if(nrNext) nrNext.addEventListener("click", ()=>{ STATE.ui.nieuweRegPage=STATE.ui.nieuweRegPage+1; render(); });

  // voertuigen: search / sort / paginate
  const vSearch = document.getElementById("voertuigen-search");
  if(vSearch){ let t; vSearch.addEventListener("input", e=>{ clearTimeout(t); const v=e.target.value; t=setTimeout(()=>{ STATE.ui.voertuigenSearch=v; STATE.ui.voertuigenPage=1; render(); document.getElementById("voertuigen-search").focus(); document.getElementById("voertuigen-search").selectionStart = document.getElementById("voertuigen-search").value.length; },300); }); }
  app.querySelectorAll("[data-sort-col]").forEach(el=> el.addEventListener("click", ()=>{
    const col = el.getAttribute("data-sort-col");
    const cur = STATE.ui.voertuigenSort;
    STATE.ui.voertuigenSort = cur.col===col ? { col, dir: cur.dir==="asc"?"desc":"asc" } : { col, dir:"asc" };
    render();
  }));
  const vPrev = document.getElementById("voertuigen-prev"); if(vPrev) vPrev.addEventListener("click", ()=>{ STATE.ui.voertuigenPage=Math.max(1,STATE.ui.voertuigenPage-1); render(); });
  const vNext = document.getElementById("voertuigen-next"); if(vNext) vNext.addEventListener("click", ()=>{ STATE.ui.voertuigenPage=STATE.ui.voertuigenPage+1; render(); });

  // row click -> detail
  app.querySelectorAll("[data-open-detail]").forEach(el=> el.addEventListener("click", (ev)=>{
    if(ev.target.closest("[data-tip]") && ev.target.tagName==="SPAN" && ev.target.classList.contains("tag-icon-info")) return;
    STATE.detailRecord = el.getAttribute("data-open-detail"); render();
  }));
  const detailClose = document.getElementById("detail-close"); if(detailClose) detailClose.addEventListener("click", ()=>{ STATE.detailRecord=null; render(); });
  const detailOverlay = document.getElementById("detail-overlay"); if(detailOverlay) detailOverlay.addEventListener("click", (e)=>{ if(e.target===detailOverlay){ STATE.detailRecord=null; render(); } });

  // nieuwe modellen widget
  app.querySelectorAll("[data-add-model]").forEach(el=> el.addEventListener("click", ()=>{
    const [merk, model] = el.getAttribute("data-add-model").split("|");
    STATE.newDetectedAdded.add(merk+"|"+model.toUpperCase());
    STATE.settings.extraModels.push({ merk, pattern:"^"+model.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), groep:"Overig", status: MachineClassification.brandByAlias(merk)?.group==="SMT"?"SMT":"Concurrent" });
    render();
  }));

  // instellingen
  app.querySelectorAll("[data-toggle-brand]").forEach(el=> el.addEventListener("change", ()=>{
    const id = el.getAttribute("data-toggle-brand");
    STATE.settings.competitorActive[id] = el.checked;
    render();
  }));
  app.querySelectorAll("[data-settings-grens]").forEach(el=> el.addEventListener("click", ()=>{ STATE.settings.replacementAge=+el.getAttribute("data-settings-grens"); STATE.ui.machineparkGrensLeeftijd=STATE.settings.replacementAge; render(); }));
  app.querySelectorAll("[data-theme-choice]").forEach(el=> el.addEventListener("click", ()=>{ STATE.theme=el.getAttribute("data-theme-choice"); localStorage_set("smt_theme",STATE.theme); render(); }));
  const addModelBtn = document.getElementById("add-model-row");
  if(addModelBtn) addModelBtn.addEventListener("click", ()=>{
    const merk = (document.getElementById("new-model-merk").value||"").toUpperCase().trim();
    const pattern = (document.getElementById("new-model-pattern").value||"").trim();
    const groep = document.getElementById("new-model-groep").value;
    if(!merk || !pattern) return;
    const brand = MachineClassification.brandByAlias(merk);
    STATE.settings.extraModels.push({ merk, pattern, groep, status: brand&&brand.group==="SMT"?"SMT":"Concurrent" });
    document.getElementById("new-model-merk").value=""; document.getElementById("new-model-pattern").value="";
    render();
  });
  app.querySelectorAll("[data-diag-test]").forEach(el=> el.addEventListener("click", ()=> runDiagTest(el.getAttribute("data-diag-test"))));
  const diagAll = document.getElementById("diag-test-all");
  if(diagAll) diagAll.addEventListener("click", async ()=>{ for(const b of BRANDS) await runDiagTest(b.aliases[0]); });
}

/* =====================================================================
   Sectie 26: boot
   ===================================================================== */
function boot(){
  STATE.data = generateDemoDataset();
  render();
  loadLiveData();
}
boot();
</script>

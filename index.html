<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Bouwmachine Marktanalyse</title>
<style>
/* ============ TOKENS ============ */
:root{
  color-scheme: light;
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#F7F8FC; --surface-hover:#EEF0F9;
  --border:#E1E3EE; --border-strong:#CBCFE3;
  --text-primary:#1A1F36; --text-secondary:#545B75; --text-muted:#8A8FA3;
  --brand:#263586; --brand-hover:#1D2966; --brand-tint:#EAECF9; --brand-tint-2:#DCDFF5;
  --accent:#F15A31; --accent-hover:#D8471F; --accent-tint:#FDE7E0;
  --good:#0ca30c; --warning:#b3790f; --serious:#c0602f; --critical:#d03b3b;
  --good-tint:#E4F6E4; --warning-tint:#FBF1DC; --critical-tint:#FBE7E7;
  --s1:#3454B4; --s2:#0F8F6B; --s3:#C98500; --s4:#6A4FC4; --s5:#C2478A; --s6:#1E8FC7; --s7:#B24A2E; --s-other:#767B94;
  --cat1:#2a78d6; --cat2:#eb6834; --cat3:#1baf7a; --cat4:#eda100; --cat5:#e87ba4; --cat6:#008300; --cat7:#4a3aa7; --cat8:#e34948;
  --grid:#E7E9F2; --shadow: 0 1px 2px rgba(26,31,54,0.06), 0 1px 8px rgba(26,31,54,0.04);
  --radius:8px; --radius-sm:5px;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1224; --surface:#161B33; --surface-2:#1B2140; --surface-hover:#212748;
    --border:#2A3157; --border-strong:#3A4270;
    --text-primary:#F2F3F8; --text-secondary:#B8BDD6; --text-muted:#7D84A8;
    --brand:#5C7CE0; --brand-hover:#7995EA; --brand-tint:#1C2350; --brand-tint-2:#232C5E;
    --accent:#FF7A52; --accent-hover:#FF9270; --accent-tint:#3A2318;
    --good:#3FC33F; --warning:#E0AA3E; --serious:#E0895E; --critical:#E66767;
    --good-tint:#122A16; --warning-tint:#2E2410; --critical-tint:#2E1414;
    --s1:#6C8CE8; --s2:#2FA482; --s3:#B87F22; --s4:#8C7CE0; --s5:#D866A0; --s6:#3D93C9; --s7:#D2653F; --s-other:#9096B3;
    --cat1:#3987e5; --cat2:#d95926; --cat3:#199e70; --cat4:#c98500; --cat5:#d55181; --cat6:#008300; --cat7:#9085e9; --cat8:#e66767;
    --grid:#252B4C; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 8px rgba(0,0,0,0.2);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1224; --surface:#161B33; --surface-2:#1B2140; --surface-hover:#212748;
  --border:#2A3157; --border-strong:#3A4270;
  --text-primary:#F2F3F8; --text-secondary:#B8BDD6; --text-muted:#7D84A8;
  --brand:#5C7CE0; --brand-hover:#7995EA; --brand-tint:#1C2350; --brand-tint-2:#232C5E;
  --accent:#FF7A52; --accent-hover:#FF9270; --accent-tint:#3A2318;
  --good:#3FC33F; --warning:#E0AA3E; --serious:#E0895E; --critical:#E66767;
  --good-tint:#122A16; --warning-tint:#2E2410; --critical-tint:#2E1414;
  --s1:#6C8CE8; --s2:#2FA482; --s3:#B87F22; --s4:#8C7CE0; --s5:#D866A0; --s6:#3D93C9; --s7:#D2653F; --s-other:#9096B3;
  --cat1:#3987e5; --cat2:#d95926; --cat3:#199e70; --cat4:#c98500; --cat5:#d55181; --cat6:#008300; --cat7:#9085e9; --cat8:#e66767;
  --grid:#252B4C; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 8px rgba(0,0,0,0.2);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text-primary); font-family:var(--font);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--brand-tint-2);}
a{color:var(--brand);}
button, select, input{font-family:var(--font);}
h1,h2,h3,h4{text-wrap:balance; margin:0;}
.tabular{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ SHELL ============ */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:238px; flex:none; background:var(--brand); color:#fff; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.14);}
.sidebar-brand .name{font-size:15px; font-weight:700; letter-spacing:0.2px;}
.sidebar-brand .sub{font-size:11px; color:rgba(255,255,255,0.62); margin-top:3px; letter-spacing:0.3px; text-transform:uppercase;}
.nav{list-style:none; margin:0; padding:10px 10px; flex:1;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm); cursor:pointer; color:rgba(255,255,255,0.82); font-size:13.5px; margin-bottom:2px; transition:background .12s;}
.nav-item:hover{background:rgba(255,255,255,0.08); color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.16); color:#fff; font-weight:600;}
.nav-item svg{flex:none; opacity:0.92;}
.nav-icon{width:16px;height:16px;}
.sidebar-foot{padding:14px 18px 18px; border-top:1px solid rgba(255,255,255,0.14); font-size:11px; color:rgba(255,255,255,0.55);}
.sidebar-foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.topbar h1{font-size:18px; font-weight:700;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.mode-badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; letter-spacing:0.4px; padding:6px 11px; border-radius:20px; cursor:pointer; border:1px solid transparent;}
.mode-badge.live{background:var(--good-tint); color:var(--good); border-color:currentColor;}
.mode-badge.demo{background:var(--warning-tint); color:var(--warning); border-color:currentColor;}
.mode-badge .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;}
.btn{
  font-family:var(--font); font-size:13px; font-weight:600; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
  background:var(--surface); color:var(--text-primary); padding:8px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--surface-hover);}
.btn:focus-visible, a:focus-visible, .nav-item:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-hover);}
.btn-accent{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-accent:hover{background:var(--accent-hover);}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn[disabled]{opacity:0.5; cursor:not-allowed;}

.filterbar{position:sticky; top:53px; z-index:19; background:var(--surface-2); border-bottom:1px solid var(--border); padding:10px 24px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.filterbar select, .filterbar input[type=text], .filterbar input[type=number]{
  font-size:12.5px; padding:6px 9px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary);
}
.filterbar label.fgroup{display:flex; flex-direction:column; gap:3px; font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px;}
.filter-chip{font-size:11px; background:var(--brand-tint); color:var(--brand); padding:3px 9px; border-radius:20px; font-weight:600; display:inline-flex; align-items:center; gap:5px;}
:root[data-theme="dark"] .filter-chip, @media (prefers-color-scheme:dark){.filter-chip{color:var(--brand);}}

.content{padding:22px 24px 60px; max-width:1440px; width:100%; margin:0 auto;}
.page-head{margin-bottom:18px;}
.page-head h2{font-size:20px; font-weight:700;}
.page-head p{margin:4px 0 0; color:var(--text-secondary); font-size:13px; max-width:70ch;}

/* ============ GRID / CARDS ============ */
.grid{display:grid; gap:14px;}
.grid-kpi{grid-template-columns:repeat(auto-fit, minmax(190px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
.card-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-secondary); margin-bottom:2px;}
.card-sub{font-size:11.5px; color:var(--text-muted); margin-bottom:10px;}

.kpi-card{display:flex; flex-direction:column; gap:5px;}
.kpi-label{font-size:11.5px; color:var(--text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.3px;}
.kpi-value{font-size:26px; font-weight:700; color:var(--brand); line-height:1.1;}
.kpi-delta{font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:3px; width:fit-content; padding:2px 7px; border-radius:20px;}
.kpi-delta.up{color:var(--good); background:var(--good-tint);}
.kpi-delta.down{color:var(--critical); background:var(--critical-tint);}
.kpi-delta.flat{color:var(--text-muted); background:var(--surface-2);}
.kpi-note{font-size:11px; color:var(--text-muted);}

.section{margin-bottom:20px;}
.section-title{font-size:15px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px;}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
table{border-collapse:collapse; width:100%; font-size:12.8px; min-width:640px;}
thead th{position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--text-secondary); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none;}
thead th:hover{color:var(--brand);}
tbody td{padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; color:var(--text-primary);}
tbody tr:hover{background:var(--surface-hover); cursor:pointer;}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.3px;}
.badge-smt{background:var(--brand-tint); color:var(--brand);}
.badge-comp{background:var(--surface-2); color:var(--text-secondary); border:1px solid var(--border);}
.badge-good{background:var(--good-tint); color:var(--good);}
.badge-warn{background:var(--warning-tint); color:var(--warning);}
.badge-crit{background:var(--critical-tint); color:var(--critical);}
.conf-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.conf-hoog{background:var(--good);} .conf-middel{background:var(--warning);} .conf-laag{background:var(--critical);}

.pagination{display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:12.5px; color:var(--text-secondary);}

/* ============ CHART ============ */
.chart-wrap{width:100%; overflow-x:auto;}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:12px;}
.legend-item{display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--text-secondary); user-select:none;}
.legend-item.off{opacity:0.35;}
.legend-swatch{width:10px;height:10px;border-radius:2px; flex:none;}
.viz-tooltip{position:fixed; pointer-events:none; background:var(--text-primary); color:var(--bg); font-size:11.5px; padding:7px 10px; border-radius:6px; z-index:100; box-shadow:var(--shadow); max-width:230px; line-height:1.4; transition:opacity .06s;}
:root[data-theme="dark"] .viz-tooltip, @media (prefers-color-scheme:dark){.viz-tooltip{background:#F2F3F8; color:#0E1224;}}

/* ============ MISC ============ */
.empty-state{padding:34px 20px; text-align:center; color:var(--text-muted); font-size:13px;}
.loading{display:flex; align-items:center; gap:10px; padding:20px; color:var(--text-secondary); font-size:13px;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong); border-top-color:var(--brand); animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:2s;}}
.info-block{background:var(--brand-tint); border:1px solid var(--brand-tint-2); border-radius:var(--radius); padding:14px 16px; font-size:12.5px; color:var(--text-secondary); display:flex; gap:10px;}
.info-block b{color:var(--text-primary);}
.disclaimer{font-size:11.5px; color:var(--text-muted); border-top:1px dashed var(--border); padding-top:10px; margin-top:14px; display:flex; gap:8px;}
.insight-list{display:flex; flex-direction:column; gap:8px;}
.insight{display:flex; gap:9px; align-items:flex-start; font-size:13px; padding:10px 12px; background:var(--surface-2); border-radius:var(--radius-sm); border-left:3px solid var(--accent);}
.tag-icon-info{color:var(--text-muted); cursor:help; flex:none;}
.pill-toggle{display:inline-flex; border:1px solid var(--border-strong); border-radius:20px; overflow:hidden;}
.pill-toggle button{border:none; background:var(--surface); color:var(--text-secondary); font-size:12px; font-weight:600; padding:6px 12px; cursor:pointer;}
.pill-toggle button.active{background:var(--brand); color:#fff;}
.search-input{position:relative;}
.search-input input{width:100%; padding:9px 12px 9px 34px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface); font-size:13px; color:var(--text-primary);}
.search-input svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-muted);}
.modal-overlay{position:fixed; inset:0; background:rgba(14,18,36,0.45); z-index:50; display:flex; justify-content:flex-end;}
.modal-panel{width:min(480px, 100%); background:var(--surface); height:100%; overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,0.18); animation:slidein .18s ease-out;}
@keyframes slidein{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.modal-head{padding:18px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; position:sticky; top:0; background:var(--surface);}
.modal-body{padding:18px 20px;}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; font-size:12.8px; margin-bottom:16px;}
.detail-grid dt{color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:0.3px;}
.detail-grid dd{margin:2px 0 0; font-weight:600; color:var(--text-primary);}
.detail-section-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--brand); margin:16px 0 8px; padding-top:10px; border-top:1px solid var(--border);}
.notavail{color:var(--text-muted); font-style:italic; font-weight:500 !important;}
.na-note{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:11.5px; color:var(--text-muted); margin-top:6px;}
.stat-row{display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.checkbox-row{display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13px;}
.switch{position:relative; width:34px; height:19px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--border-strong); border-radius:20px; transition:.15s; cursor:pointer;}
.switch .track:before{content:"";position:absolute;width:14px;height:14px;left:2.5px;top:2.5px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .track{background:var(--good);}
.switch input:checked + .track:before{transform:translateX(15px);}
.settings-table input[type=text]{padding:5px 8px; font-size:12px; border-radius:4px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary); width:100%;}
code, .mono{font-family:ui-monospace,Consolas,Menlo,monospace; font-size:11.6px; background:var(--surface-2); padding:1px 5px; border-radius:4px; color:var(--text-primary);}
.diag-log{background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; font-size:11.5px; font-family:ui-monospace,Consolas,monospace; white-space:pre-wrap; max-height:180px; overflow-y:auto; color:var(--text-secondary);}
@media (max-width:880px){
  .sidebar{position:fixed; left:-238px; z-index:40; transition:left .18s;} .sidebar.open{left:0;}
  .detail-grid{grid-template-columns:1fr;}
}
</style>

<script>
"use strict";
const RDW_DATASET_ID = "m9d7-ebf2";
const RDW_BASE = "https://opendata.rdw.nl/resource/" + RDW_DATASET_ID + ".json";
const RDW_FUEL_BASE = "https://opendata.rdw.nl/resource/8ys7-d773.json"; // Gekentekende_voertuigen_brandstof

/* =====================================================================
   Sectie 1b: classificatie-engine (machine-classification.js embedded)
   Bronbestand: classification/machine-classification.js — dat bestand is
   de canonieke bron (Node-testbaar, CSV-regressietestbaar buiten de app);
   hier ingesloten zodat de dashboard-app zelfstandig blijft werken (ook als
   losstaande Artifact-preview, die geen externe <script src> toestaat).
   Bij wijzigingen: eerst classification/machine-classification.js aanpassen
   en testen (node classification/machine-classification.test.js), dan
   opnieuw hier embedden.
   ===================================================================== */
"use strict";
/* =============================================================================
   MACHINE CLASSIFICATION ENGINE — RDW bouwmachine-classificatie
   =============================================================================
   Centrale, onderhoudbare classificatielaag voor het Bouwmachine Marktanalyse
   dashboard. Draait zowel in de browser (window.MachineClassification) als in
   Node (module.exports) — zelfde bestand, geen build-stap, geen dependencies.

   Waarom één bestand i.p.v. een map met losse modules: de rest van de
   applicatie (smt-market-intelligence.html) is bewust een enkel zelfstandig
   HTML-bestand zonder build-tooling (o.a. omdat het ook als losstaande
   Artifact-preview gepubliceerd moet kunnen worden, wat externe <script src>
   niet toestaat). Een map met 6+ los-geladen bestanden zou die aanpak breken.
   In plaats daarvan is dit ÉÉN module met de door de opdracht gevraagde
   conceptuele scheiding (aliases / model-patterns / exclusions / product-
   groups / fuel-types) als duidelijk gemarkeerde secties hieronder, en wordt
   de HTML-app opgebouwd door dit bestand te embedden (zie "Sectie X: sync"
   in smt-market-intelligence.html voor de exacte procedure).

   Regelselectie: elke regel heeft een expliciete numerieke "priority". Bij
   meerdere matchende regels voor hetzelfde merk wint de HOOGSTE priority
   (bij gelijke priority: de regel die het EERST is geregistreerd). Dit is
   een bewuste fix t.o.v. een eerdere versie van dit dashboard die de
   "langste regex-broncode" liet winnen — daardoor won een generieke
   \d{2,3}-vangnetregel per ongeluk vaak van een specifiek uitgeschreven
   modelnummer, puur omdat "\\d{2,3}" als tekst langer is dan een letterlijk
   getal als "230". Alle regels in dit bestand zijn hierdoor voorzien van een
   priority die correspondeert met hun specificiteit:
     100  expliciete uitsluiting (altijd eerst gecheckt, wint altijd)
      20  exact bekend modelnummer/serie, hoge betrouwbaarheid ("Hoog")
      10  bredere prefix-herkenning, middelmatige betrouwbaarheid ("Middel")
   ========================================================================== */

(function (root) {

/* ===========================================================================
   SECTIE 1 — Tekstnormalisatie
   =========================================================================== */
function normalizeText(s) {
  if (s == null) return "";
  return String(s)
    .toUpperCase()
    .normalize("NFKD").replace(/[̀-ͯ]/g, "") // Ä/Ö/Ü etc -> A/O/U (Schäffer -> SCHAFFER)
    .replace(/[‐-―]/g, "-")                  // en/em-dash varianten -> gewone hyphen
    .replace(/[.·]/g, ".")                        // varianten van een punt normaliseren
    .replace(/\s+/g, " ")
    .trim();
}

// RDW slaat handelsbenaming soms mét herhaald merk op (bv. "SENNEBOGEN 340G",
// "WEIDEMANN 1280", "KRAMER 5035", "LIUGONG 820TE") — patronen zijn met ^
// verankerd op het modelnummer, dus dat voorvoegsel moet eerst weg.
function stripBrandPrefix(canonicalLabelN, aliasesN, modelN) {
  const candidates = [canonicalLabelN].concat(aliasesN || []);
  for (const c of candidates) {
    const esc = c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const stripped = modelN.replace(new RegExp("^" + esc + "\\s+"), "");
    if (stripped !== modelN) return stripped;
  }
  return modelN;
}

/* ===========================================================================
   SECTIE 2 — Canonieke merken + aliases (RDW "merk"-schrijfwijzen)
   ===========================================================================

/* ===========================================================================
   SECTIE 4 — Regel-engine
   =========================================================================== */
const RULES = [];     // { brandId, regex, source, productGroup, status, confidence, priority }
const EXCLUSIONS = []; // { brandId, regex, source, reason }

function addRule(brandId, pattern, groep, confidence, priority) {
  const brand = brandById(brandId);
  RULES.push({
    brandId: brandId,
    regex: new RegExp(pattern, "i"),
    source: pattern,
    productGroup: groep,
    status: brand ? brand.group : "Concurrent",
    confidence: confidence || "Middel",
    priority: priority == null ? 10 : priority,
  });
}
function addHighRule(brandId, pattern, groep) { addRule(brandId, pattern, groep, "Hoog", 20); }
function addMidRule(brandId, pattern, groep) { addRule(brandId, pattern, groep, "Middel", 10); }
function addExclusion(brandId, pattern, reason) {
  EXCLUSIONS.push({ brandId: brandId, regex: new RegExp(pattern, "i"), source: pattern, reason: reason });
}
// Helper voor reeksen met generatie/aandrijvingssuffix-tolerantie (optioneel
// 1 letter + tot 3 alfanumeriek, met of zonder spatie/koppelteken ervoor) —
// dekt bv. Caterpillar 906M, Liebherr A916 LITRONIC (via bredere variant),
// Sennebogen 835M, Volvo L120H2.
function suffixPattern(prefix, num) {
  return "^" + prefix + "\\s?" + num + "(\\s?[A-Z][A-Z0-9\\-]{0,3})?\\b";
}
// Bredere suffix-tolerantie voor merken met langere tekstuele suffixen
// (Liebherr "LITRONIC", "COMPACT LITRONIC"; Mecalac "-NG"): staat een los
// woord van letters/cijfers/koppeltekens toe, evt. met spatie ervoor.
function wideSuffixPattern(prefix, num) {
  return "^" + prefix + "\\s?" + num + "(\\s?[A-Z][A-Z0-9\\- ]{0,20})?\\b";
}
function addRangeHigh(brandId, prefix, nums, groep) {
  nums.forEach(function (n) { addHighRule(brandId, suffixPattern(prefix, n), groep); });
}
function addRangeWideHigh(brandId, prefix, nums, groep) {
  nums.forEach(function (n) { addHighRule(brandId, wideSuffixPattern(prefix, n), groep); });
}

// voertuigsoort-filter in de live-fetchlaag al uitgesloten, buiten scope van
// deze module) én Daewoo/Doosan-vorkheftrucks (D../G..-codes: D25S, D30GP,
// "D30 G", G25GP — zelfde D/G-forklift-conventie als Cat/Komatsu, maar met
// meer suffixvarianten dan alleen "S"). Alleen de MEGA-wielladerserie is
// relevant grondverzetmaterieel. Regressietest tegen de live CSV-export
// bevestigde dat deze vorkheftruck-codes ook ONDER merk "DOOSAN" zelf
// voorkomen (niet alleen historisch via Daewoo) — vandaar dat de uitsluiting
// op het hele merk (incl. de Daewoo-alias) van toepassing is, niet alleen op
// de Daewoo-alias.
addHighRule("DOOSAN", "^MEGA\\s?\\d{2,4}\\b", "Wielladers");
addExclusion("DOOSAN", "^[DG]\\s?\\d{2}(S|GP|G)?(C)?(\\-[0-9]{1,2})?\\b", "Daewoo/Doosan vorkheftruck-serie, geen grondverzetmaterieel");

// --- Hyundai --- (audit: HW.../ROBEX ...W mobiele graafmachine)
["140","180","210","220","235","250","300","330","380","480","500","800"].forEach(function (n) {
  addHighRule("HYUNDAI", "^R\\s?" + n + "\\s?W(\\-[0-9])?([A-Z0-9]{0,3})?\\b", "Mobiele graafmachines");
  addHighRule("HYUNDAI", "^ROBEX\\s?" + n + "\\s?W(\\-[0-9])?([A-Z0-9]{0,3})?\\b", "Mobiele graafmachines");
});
["30","33","35","55","60","62","70","75","80","85","95","140","145","160"].forEach(function (n) {
  addHighRule("HYUNDAI", suffixPattern("HW", n), "Mobiele graafmachines");
});
["730","740","757","770","940","955","960","970","975","980"].forEach(function (n) { addHighRule("HYUNDAI", suffixPattern("HL", n), "Wielladers"); });
// Nieuwere generatie rupsgraafmachines (HX-serie, verving R-serie)
["30","55","85","140","145","160","220","235","260","300","330","380","480","520"].forEach(function (n) {
  addHighRule("HYUNDAI", suffixPattern("HX", n), "Rupsgraafmachines");
});
// Mini-rupsgraafmachines: XXD/XXBH/XXDA/XXL-generatiecode (bv. 30D-9, 33D-7E,
// 30BH-9, 50DA-9, 30L-7) — géén W-suffix, dus per definitie rups i.p.v. wiel.
addMidRule("HYUNDAI", "^\\d{2,3}(D|BH|DA|L)(A)?\\-\\d{1,2}[A-Z]?\\b", "Rupsgraafmachines");
// RDW laat de R/ROBEX-prefix soms weg (bv. "140W-9" i.p.v. "R140W-9" of
// "ROBEX 140W-9") — bevestigd via live CSV-steekproef.
addMidRule("HYUNDAI", "^\\d{2,3}\\s?W(\\-[0-9]{1,2})?[A-Z]{0,2}\\b", "Mobiele graafmachines");
addMidRule("HYUNDAI", "^HW\\s?\\d{2,3}([A-Z0-9]{0,3})?\\b", "Mobiele graafmachines");
addMidRule("HYUNDAI", "^R\\s?\\d{2,3}\\s?W([A-Z0-9\\-]{0,4})?\\b", "Mobiele graafmachines");
// Hyundai-heftrucks (HDF-serie diesel) — andere divisie, geen grondverzet.
addExclusion("HYUNDAI", "^H[DL]F\\s?\\d{2,3}", "Hyundai heftruck-serie (diesel/LPG), geen grondverzetmaterieel");
// Hyundai heftrucks hebben ook een kale nummer+B/BT-notatie (bv. "50B-9",
// "18BT-9U", "20BT-9U") — ontdekt via de elektrisch-detectie-audit: deze
// codes zijn overwegend Elektriciteit. Anker op B/BT direct na het nummer
// zodat dit NIET overlapt met de mini-graafmachine-notatie hierboven, die
// altijd D/BH/DA/L als suffix gebruikt (nooit kale B/BT).
addExclusion("HYUNDAI", "^\\d{2,3}BT?\\-?\\d{1,2}[A-Z]{0,3}\\b", "Hyundai heftruck-serie (elektrisch), geen grondverzetmaterieel");
// Historische personenauto-modellen die soms binnen de gefilterde
// voertuigsoort-categorieën opduiken (bv. Galloper) blijven bewust
// ongeclassificeerd zolang er geen modelpatroon voor bestaat — géén
// strictModelMatch nodig, ze vallen simpelweg terug op "Overig"/laag

// --- Sany --- (audit: SY...W mobiele graafmachine, STH... verreiker)
["16","35","50","75","135","155","215","235","305","365","500"].forEach(function (n) {

["405","408","409","413"].forEach(function (n) { addHighRule("SANY", suffixPattern("SW", n), "Wielladers"); });

addHighRule("FUCHS", "^MHL\\s?\\d{2,3}\\b", "Overslagmachines");

// --- JCB --- (audit: HYDRADIG/HD110W/110W mobiele graafmachine, SITEDUMPER)
addHighRule("JCB", "^HYDRADIG(\\s?PLUS)?(\\s?110\\s?W)?\\b", "Mobiele graafmachines");

addHighRule("JCB", "^110\\s?W\\b", "Mobiele graafmachines");

["403","409","411","414","417","419","437","457"].forEach(function (n) {

// --- Case --- (audit: 321/521/621/721/821/921 wiellader)
["321","521","621","721","821","921","1021"].forEach(function (n) {

addHighRule("CASE", "CX\\s?\\d{2,3}", "Rupsgraafmachines");
// Case skid steer/compact ("XL"-serie: 445XL/1394 etc.) en verreikers ("585 XL"

["17","55","85","140","210","220","260","300","350","500"].forEach(function (n) {

/* ===========================================================================
   SECTIE 6 — Merkregels: nieuwe concurrenten
   ===========================================================================
   Patronen hieronder zijn gebouwd op basis van live RDW-steekproeven (echte
   handelsbenaming-samples per merk), niet alleen op de audit-hints — zie
   sessie-analyse voor de brondata. Waar de data ambigu is (mogelijk andere
   productlijn, te weinig voorbeelden) is dat expliciet als commentaar
   vermeld i.p.v. geraden.
   ========================================================================= */

// --- ATLAS: wheeled excavators (1xxx/xxxW) + material handlers (AR-serie) ---
["1004","1104","1204","1304","1404","1504","1604"].forEach(function (n) {
  addHighRule("ATLAS", suffixPattern("", n), "Mobiele graafmachines");
});
["140","150","160","180","200"].forEach(function (n) {
  addHighRule("ATLAS", suffixPattern("", n + "W"), "Mobiele graafmachines");
});
addHighRule("ATLAS", "^AR\\s?\\d{2,3}[A-Z]?\\b", "Overslagmachines"); // material handler
addHighRule("ATLAS", "^AB\\s?\\d{3,4}\\s?[A-Z]?\\b", "Mobiele graafmachines"); // bv. AB 1302 D
addMidRule("ATLAS", "^\\d{3,4}\\s?W?\\b", "Mobiele graafmachines");

// --- Takeuchi: TB-serie, W-suffix = wiel, zonder = rups ---
addHighRule("TAKEUCHI", "^TB\\s?\\d{2,3}\\s?W\\b", "Mobiele graafmachines");
addHighRule("TAKEUCHI", "^TB\\s?\\d{2,3}\\b", "Rupsgraafmachines");
addHighRule("TAKEUCHI", "^TCR\\s?\\d{2,3}(\\-[0-9])?\\b", "Compact materieel"); // compact track loader

// --- Wacker Neuson: ET/EZ (rups)/EW (wiel)/WL (wiellader)/DW,DV (dumper)/TH (verreiker) ---
addHighRule("WACKERNEUSON", "^E[TZ]\\s?\\d{1,3}\\b", "Rupsgraafmachines");
addHighRule("WACKERNEUSON", "^EW\\s?\\d{1,3}(\\-[0-9])?\\b", "Mobiele graafmachines");
addHighRule("WACKERNEUSON", "^WL\\s?\\d{1,3}[A-Z]?\\b", "Wielladers");
addHighRule("WACKERNEUSON", "^D[WV]\\s?\\d{1,3}[A-Z]?(\\-[0-9])?\\b", "Dumpers");
addHighRule("WACKERNEUSON", "^TH\\s?\\d{2,4}\\b", "Verreikers");
// Historische Neuson-modelnummering vóór de EW/EZ-rebrand (bv. "6503-2") —
// vrijwel altijd compacte rupsgraafmachines.
addMidRule("WACKERNEUSON", "^\\d{4}(\\-[0-9])?(\\s?WD)?\\b", "Rupsgraafmachines");

// --- Bobcat: E (rups mini-excavator)/S (skid steer)/T (compact track loader)/L (wiellader)/TL (verreiker) ---
addHighRule("BOBCAT", "^E\\s?\\d{1,3}\\s?W\\b", "Mobiele graafmachines");
addHighRule("BOBCAT", "^E\\s?\\d{1,3}\\b", "Rupsgraafmachines");
addHighRule("BOBCAT", "^S\\s?\\d{2,3}\\b", "Compact materieel"); // skid steer loader
addHighRule("BOBCAT", "^TL\\s?\\d{2}[.\\-]?\\d{0,3}\\b", "Verreikers");
addHighRule("BOBCAT", "^T\\s?\\d{2,5}\\b", "Compact materieel"); // compact track loader
addHighRule("BOBCAT", "^L\\s?\\d{2,3}\\b", "Wielladers");
// Klassieke skid steer modelnummers zonder letterprefix (bv. "753", "553", "463")
addMidRule("BOBCAT", "^[3-9]\\d\\d\\b", "Compact materieel");

// --- Kubota: KX (mini-excavator)/U (compact excavator)/R (wiellader)/KC (compact track loader)/KTH (verreiker) ---
addHighRule("KUBOTA", "^KX\\s?\\d{1,3}[A-Z0-9\\-]{0,4}\\b", "Rupsgraafmachines");
addHighRule("KUBOTA", "^U\\s?\\d{1,3}[A-Z0-9\\-]{0,4}\\b", "Rupsgraafmachines");
addHighRule("KUBOTA", "^R\\s?\\d{2,3}[A-Z0-9\\-]{0,4}\\b", "Wielladers");
addHighRule("KUBOTA", "^KC\\s?\\d{2,3}[A-Z0-9\\-]{0,4}\\b", "Compact materieel");
addHighRule("KUBOTA", "^KTH\\s?\\d{2,4}\\b", "Verreikers");

// --- Giant / Tobroco: G (wiellader)/V (compacte/telescopische wiellader)/D (dumper) ---
addHighRule("GIANT", "^G\\s?\\d{3,4}[A-Z]{0,2}(\\s?X-TRA(\\s?HD)?)?\\b", "Wielladers");

// --- Manitou: MT/MHT/MLT/MC/MH (verreiker), MRT (roterende verreiker), ULM (compact) ---
addHighRule("MANITOU", "^MRT\\s?\\d{3,4}([A-Z0-9 +]{0,15})?\\b", "Roterende verreikers");
["MT","MHT","MLT","MC","MH"].forEach(function (p) {
  addHighRule("MANITOU", "^" + p + "\\s?\\d{2,3}[\\-A-Z0-9 ]{0,20}\\b", "Verreikers");
});
addHighRule("MANITOU", "^M\\s?\\d{2}\\-\\d\\b", "Verreikers"); // bv. "M 30-4"
addHighRule("MANITOU", "^ULM\\s?\\d{2,3}\\b", "Compact materieel");

// --- Merlo: P/Panoramic + TF (fixed telehandler), ROTO (roterende verreiker) ---
addHighRule("MERLO", "^ROTO\\s?\\d{2,3}[.\\-][0-9A-Z ]{0,10}\\b", "Roterende verreikers");
addHighRule("MERLO", "^(P|TF|PANORAMIC)\\s?\\d{2,3}[.\\-][0-9A-Z \\-]{0,10}\\b", "Verreikers");

// --- Yanmar: V-serie wielladers (VIO-rupsserie indien aangetroffen) ---
addHighRule("YANMAR", "^V\\s?\\d{2,3}(\\-[0-9])?\\b", "Wielladers");
addHighRule("YANMAR", "^VIO\\s?\\d{2,3}[A-Z0-9\\-]{0,4}\\b", "Rupsgraafmachines");

// --- Mecalac (incl. Ahlmann-erfenis): MCR/MTX/MWR (mobiele graafmachine), CX (rups), AZ (wiellader, Ahlmann-erfenis), AS (dumper) ---
addHighRule("MECALAC", "^\\d{1,2}\\s?M[CWX][RTX](\\-NG)?\\b", "Mobiele graafmachines"); // 8 MCR, 12 MTX, 9 MWR(-NG)

addHighRule("MECALAC", "^AS\\s?\\d{1,4}\\b", "Dumpers"); // Ahlmann/Mecalac site dumper

// --- Kramer: KL (wiellader)/KA (compacte wiellader)/KT (telescopische wiellader/verreiker) ---
addHighRule("KRAMER", "^KL\\s?\\d{2,3}\\b", "Wielladers");
addHighRule("KRAMER", "^KA\\s?\\d{2,3}\\b", "Wielladers");
addHighRule("KRAMER", "^KT\\s?\\d{2,3}\\b", "Verreikers");
addHighRule("KRAMER", "^KB\\s?\\d{2,3}\\b", "Verreikers"); // telescopische wiellader-variant
// Kale nummerreeksen (5xxx wiellader, 8xxx telescopisch/verreiker) — per audit
addMidRule("KRAMER", "^5\\d{3}\\b", "Wielladers");
addMidRule("KRAMER", "^8\\d{3}\\b", "Verreikers");
addMidRule("KRAMER", "^3\\d{2}(\\s?SL)?\\b", "Wielladers"); // bv. 312, 312 SL, 320, 348

// --- Weidemann: 1xxx (Hoftrac wiellader), T-serie (verreiker) ---
addHighRule("WEIDEMANN", "^1\\d{3}(\\s?CX\\d{0,2})?(\\s?(DELUXE|SPECIAL))?\\b", "Wielladers");

// --- Schäffer: 2xxx-9xxx compacte wiellader, T-serie telescopische wiellader ---
addHighRule("SCHAFFER", "^[2-9]\\d{3}(\\s?S)?\\b", "Wielladers");
addHighRule("SCHAFFER", "^T\\s?\\d{2,3}\\b", "Verreikers");
addMidRule("SCHAFFER", "^[2-4]\\d\\d(\\s?S)?\\b", "Wielladers"); // 3-cijferige varianten, bv. 336, 222 S

// --- Magni: TH (fixed verreiker), RTH (roterende verreiker) ---
addHighRule("MAGNI", "^RTH\\s?\\d(\\.\\d{1,2})?[\\-A-Z0-9/ ]{0,15}\\b", "Roterende verreikers");
addHighRule("MAGNI", "^(TH|HTH)\\s?\\d(\\.\\d{1,2})?[\\-A-Z0-9/ ]{0,15}\\b", "Verreikers");

// --- Dieci: alleen de bevestigde bouw-telehandlerfamilies (AGRI-lijn blijft
// bewust buiten scope, dat is landbouwmaterieel) ---
addHighRule("DIECI", "^(APOLLO|DEDALUS|ICARUS|ZEUS|PEGASUS|HERCULES)\\s?\\d{2}\\.\\d{1,2}\\b", "Verreikers");

// --- LiuGong: 8xx wielladers, 9xx graafmachines (audit); CLG-prefix-varianten ---
["842","848","856","865","877","890"].forEach(function (n) {
  addHighRule("LIUGONG", suffixPattern("", n), "Wielladers");
  addHighRule("LIUGONG", suffixPattern("CLG", n), "Wielladers");
});
addMidRule("LIUGONG", "^8\\d\\d([\\-A-Z0-9]{0,6})?\\b", "Wielladers");
addMidRule("LIUGONG", "^9\\d\\d([\\-A-Z0-9]{0,6})?\\b", "Rupsgraafmachines");

// --- XCMG: alleen bevestigde wiellader-prefixen (LW/ZL); XC-serie lijkt op
// elektrische heftrucks (XC9xx-EV) en blijft daarom bewust ongeclassificeerd
// totdat dat met zekerheid is uitgesloten. ---
addHighRule("XCMG", "^LW\\s?\\d{2,4}[A-Z]?\\b", "Wielladers");
addHighRule("XCMG", "^ZL\\s?\\d{2,4}[A-Z]?\\b", "Wielladers");
addExclusion("XCMG", "^X[CT]\\s?\\d{3,4}(\\-EV|E|EV)?\\b", "Lijkt op XCMG-heftruckcode (XC9xx-EV-patroon), nog niet bevestigd als grondverzetmaterieel");

// --- Terex: TL/TW (compacte wielladers), SKL/SKS (Schaeff-erfenis wielladers),
// AL (articulated loader), TELELIFT/GTH (verreikers), TC (mini-rupsgraafmachine) ---
addHighRule("TEREX", "^TW\\s?\\d{2,3}(AS|SR)?\\b", "Wielladers");
addHighRule("TEREX", "^TL\\s?\\d{2,3}(AS|SR)?\\b", "Wielladers");
addHighRule("TEREX", "^SK[LS]\\s?\\d{2,3}\\b", "Wielladers");
addMidRule("TEREX", "^AL\\s?\\d{2,3}\\b", "Wielladers"); // articulated loader
addHighRule("TEREX", "^TELELIFT\\s?\\d{3,4}\\b", "Verreikers");
addHighRule("TEREX", "^GTH\\s?\\d{3,4}\\b", "Verreikers");
addMidRule("TEREX", "^TC\\s?\\d{2,3}\\b", "Rupsgraafmachines"); // mini-rupsgraafmachine, minder zeker
// Terex AGRILIFT is een agrarische verreiker (zelfde overweging als Dieci's
// AGRI-lijn) — bewust buiten scope van dit grondverzet-dashboard.
addExclusion("TEREX", "^AGRILIFT\\s?\\d{2,4}\\b", "Agrarische verreiker, geen bouwmaterieel");

/* ===========================================================================
   SECTIE 7 — Brandstof / elektrisch classificatie
   ===========================================================================
   Prioriteit: (1) echte RDW-brandstofdata per kenteken (brandstofTypes,
   via een losse koppel-dataset — zie fetchFuelTypes in de hoofdapplicatie),
   (2) bekende elektrische modelnamen als aanvullende validatie, (3) generieke
   tekstheuristiek als laatste redmiddel. Een kale "E" in het typenummer is
   NOOIT genoeg — dat matcht te veel toevallige modelcodes (bv. "318E" is
   een dieselmodel-generatie bij meerdere merken).

// bron als string, leesbaar), electric, confidence ("Hoog"/"Middel"),
// source (waar de aanname op gebaseerd is + bekende beperkingen).
//
// Regressietest tegen 91.008 live RDW-registraties (alle 26 merken, echte
// brandstofdata per kenteken) leverde een BELANGRIJKE correctie op: een

    source: "Live RDW-steekproef: alle 48 gevonden J/LJ/JYL-voorvoegsel-registraties (JL25H, JL20H, JYL120, JL25 ELEKTRIC/ELECTRIC, JL25HZ, LJ120H ELEKTRIC, ...) zijn Elektriciteit — 48/48 (100%), geen enkel tegenvoorbeeld. Kennelijk hoe RDW/dealers Volvo se elektrische compacte-wielladerlijn (L20/L25/L120 Electric) noteren.",
  },
];
function isKnownElectricModel(brandId, modelN) {
  return KNOWN_ELECTRIC_MODELS.some(function (r) {
    return r.canonicalBrand === brandId && r.electric && new RegExp(r.modelPattern, "i").test(modelN);
  });
}
// Tekstheuristiek als laatste redmiddel — bewust EXPLICIET op volledige
// woorden (ELEKTR.., ELECTRIC, BEV, BATTERY, E-DRIVE), nooit op een losse
// letter "E" in het typenummer, om vals-positieven te voorkomen.
function textElectricGuess(modelN, brandstofOmsN) {
  const s = modelN + " " + (brandstofOmsN || "");
  if (/\bELEKTR|\bELECTRIC\b|E-DRIVE|\bEQ\b|BATTERY|\bBEV\b/.test(s)) return "Ja";
  if (/\bHYBRID/.test(s)) return "Hybride";
  return null;
}
function detectFuelType(brandId, modelN, brandstofOmsText, brandstofTypesArr) {
  if (Array.isArray(brandstofTypesArr) && brandstofTypesArr.length) {
    const heeftElektrisch = brandstofTypesArr.some(function (f) { return /elektr/i.test(f); });
    const heeftVerbranding = brandstofTypesArr.some(function (f) { return !/elektr/i.test(f); });
    if (heeftElektrisch && heeftVerbranding) return { elektrisch: "Hybride", brandstof: brandstofTypesArr.join(" + "), bron: "rdw-brandstofdata" };
    if (heeftElektrisch) return { elektrisch: "Ja", brandstof: brandstofTypesArr.join(" + "), bron: "rdw-brandstofdata" };
    return { elektrisch: "Nee", brandstof: brandstofTypesArr.join(" + "), bron: "rdw-brandstofdata" };
  }
  if (isKnownElectricModel(brandId, modelN)) {
    return { elektrisch: "Ja", brandstof: brandstofOmsText || "Onbekend", bron: "bekend-elektrisch-model" };
  }
  const guess = textElectricGuess(modelN, brandstofOmsText);
  if (guess) return { elektrisch: guess, brandstof: brandstofOmsText || "Onbekend", bron: "tekstheuristiek" };
  return { elektrisch: brandstofOmsText ? "Nee" : "Onbekend", brandstof: brandstofOmsText || "Onbekend", bron: brandstofOmsText ? "brandstoftekst" : "geen-data" };
}

/* ===========================================================================
   SECTIE 8 — Hoofd classify-functie
   =========================================================================== */
function classify(rdwMerk, handelsbenaming) {
  const merkN = normalizeText(rdwMerk);
  const rawModelN = normalizeText(handelsbenaming);
  const brand = brandByAlias(merkN);
  if (!brand) {
    return { brandId: null, canonicalBrand: null, productGroup: "Onbekend", status: "Onbekend", confidence: "Laag", matchedRule: null, reason: "RDW-merk niet in merkenlijst" };
  }
  const aliasesN = brand.aliases.map(normalizeText);
  const modelN = stripBrandPrefix(normalizeText(brand.label), aliasesN, rawModelN);

  // 1) expliciete uitsluitingen winnen altijd
  const excl = EXCLUSIONS.find(function (e) { return e.brandId === brand.id && e.regex.test(modelN); });
  if (excl) {
    return { brandId: null, canonicalBrand: brand.id, productGroup: "Onbekend", status: "Onbekend", confidence: "Hoog", matchedRule: excl.source, reason: excl.reason };
  }

  // 2) hoogste-priority matchende regel wint (bij gelijke priority: eerst geregistreerd)
  let best = null;
  for (let i = 0; i < RULES.length; i++) {
    const r = RULES[i];
    if (r.brandId !== brand.id) continue;
    if (!r.regex.test(modelN)) continue;
    if (!best || r.priority > best.priority) best = r;
  }
  if (best) {
    return { brandId: brand.id, canonicalBrand: brand.id, productGroup: best.productGroup, status: best.status, confidence: best.confidence, matchedRule: best.source, reason: null };
  }

  // 3) geen regel gematcht
  if (brand.strictModelMatch) {
    return { brandId: null, canonicalBrand: brand.id, productGroup: "Onbekend", status: "Onbekend", confidence: "Laag", matchedRule: null, reason: "strict-match merk, geen modelpatroon gevonden (mogelijk niet-relevant voertuig van dit merk)" };
  }
  if (modelN) {
    return { brandId: brand.id, canonicalBrand: brand.id, productGroup: "Overig", status: brand.group, confidence: "Laag", matchedRule: null, reason: "merk herkend, geen specifiek modelpatroon" };
  }
  return { brandId: brand.id, canonicalBrand: brand.id, productGroup: "Onbekend", status: brand.group, confidence: "Laag", matchedRule: null, reason: "geen handelsbenaming beschikbaar" };
}

// Legt exact uit waarom een record niet (specifiek) is geclassificeerd.
function explainRecord(rdwMerk, handelsbenaming) {
  const cls = classify(rdwMerk, handelsbenaming);
  return {
    merk: rdwMerk, handelsbenaming: handelsbenaming,
    canonicalBrand: cls.canonicalBrand ? brandById(cls.canonicalBrand).label : null,
    productGroup: cls.productGroup, status: cls.status, confidence: cls.confidence,
    matchedRule: cls.matchedRule, reason: cls.reason,
  };
}
// records: array van {merk, handelsbenaming}. Retourneert top-N merk+model
// combinaties die (nog) als Overig/Onbekend eindigen, aflopend op aantal.
function topUnclassifiedCombos(records, limit) {
  const tally = new Map();
  records.forEach(function (r) {
    const cls = classify(r.merk, r.handelsbenaming);
    if (cls.productGroup !== "Overig" && cls.brandId !== null) return; // alleen echte Overig/uitgesloten
    const key = r.merk + "|" + r.handelsbenaming;
    if (!tally.has(key)) tally.set(key, { merk: r.merk, handelsbenaming: r.handelsbenaming, aantal: 0, reason: cls.reason });
    tally.get(key).aantal++;
  });
  return Array.from(tally.values()).sort(function (a, b) { return b.aantal - a.aantal; }).slice(0, limit || 50);
}

/* =====================================================================
   Sectie 2: datumhelpers
   RDW levert datums als YYYYMMDD (getal of string). Alle parsing loopt
   centraal via onderstaande helpers.
   ===================================================================== */
const MAANDEN_NL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
function parseRdwDate(v){
  if(v==null || v==="") return null;
  const s = String(v).replace(/[^0-9]/g,"");
  if(s.length<8) return null;
  const y=+s.slice(0,4), m=+s.slice(4,6), d=+s.slice(6,8);
  if(!y||y<1950||y>2100||m<1||m>12||d<1||d>31) return null;
  const dt = new Date(Date.UTC(y,m-1,d));
  return isNaN(dt.getTime()) ? null : dt;
}
function formatDateNL(dt, compact){
  if(!dt) return "Onbekend";
  if(compact){
    const dd=String(dt.getUTCDate()).padStart(2,"0"), mm=String(dt.getUTCMonth()+1).padStart(2,"0");
    return dd+"-"+mm+"-"+dt.getUTCFullYear();
  }
  return dt.getUTCDate()+" "+MAANDEN_NL[dt.getUTCMonth()]+" "+dt.getUTCFullYear();
}
function ageFromDate(dt, ref){
  if(!dt) return null;
  ref = ref || new Date();
  let age = ref.getUTCFullYear() - dt.getUTCFullYear();
  const m = ref.getUTCMonth() - dt.getUTCMonth();
  if(m<0 || (m===0 && ref.getUTCDate()<dt.getUTCDate())) age--;
  return Math.max(0,age);
}
function monthsBetween(a,b){
  if(!a||!b) return null;
  return (b.getUTCFullYear()-a.getUTCFullYear())*12 + (b.getUTCMonth()-a.getUTCMonth());
}
function yearOf(dt){ return dt ? dt.getUTCFullYear() : null; }
function quarterOf(dt){ return dt ? Math.floor(dt.getUTCMonth()/3)+1 : null; }
function monthKey(dt){ return dt ? dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0") : null; }

/* =====================================================================
   Sectie 3: classificatie-engine
   Herkent per RDW-record (merk + handelsbenaming) de productgroep, of het
   een SMT- of concurrentmerk is, en met welke betrouwbaarheid.
   ===================================================================== */
function normalizeText(s){ return MachineClassification.normalizeText(s); }

// Dunne adapter rond de centrale classificatiemodule (classification/machine-
// classification.js, hierboven ingesloten). Bewaart daarnaast de bestaande
// "handmatig een model toevoegen"-functionaliteit uit Instellingen
// (STATE.settings.extraModels): die wordt ALLEEN geraadpleegd als de centrale
// module een record niet (specifiek) herkent, zodat een gebruiker een Overig-
// geval kan verbijzonderen zonder de module zelf te wijzigen.
function classifyByModel(rdwMerk, handelsbenaming){
  const cls = MachineClassification.classify(rdwMerk, handelsbenaming);
  if((cls.productGroup==="Overig" || cls.brandId===null) && STATE.settings.extraModels.length){
    const merkN = MachineClassification.normalizeText(rdwMerk);
    const modelN = MachineClassification.normalizeText(handelsbenaming);
    const extra = STATE.settings.extraModels.find(function(m){
      return MachineClassification.normalizeText(m.merk)===merkN && new RegExp(m.pattern,"i").test(modelN);
    });
    if(extra){
      const brand = MachineClassification.brandByAlias(merkN);
      return { productgroep:extra.groep, status:extra.status, confidence:"Middel", matched:extra.pattern, brandId: brand?brand.id:null, canonicalBrand: cls.canonicalBrand };
    }
  }
  return { productgroep:cls.productGroup, status:cls.status, confidence:cls.confidence, matched:cls.matchedRule, brandId:cls.brandId, canonicalBrand:cls.canonicalBrand };
}

// Elektrisch-detectie. Bij live data hebben we de ECHTE RDW-brandstoftypes (gekoppeld via
// kenteken, zie fetchFuelTypes) — die zijn altijd leidend. Bekende elektrische modelnamen
// dienen als aanvullende validatie; een kale tekstheuristiek is het laatste redmiddel.
// Zie classification/machine-classification.js sectie 7 voor de volledige logica.
function detectElectric(canonicalBrandId, handelsbenaming, brandstofOms, brandstofTypes){
  const modelN = MachineClassification.normalizeText(handelsbenaming);
  return MachineClassification.detectFuelType(canonicalBrandId, modelN, brandstofOms, brandstofTypes).elektrisch;
}

function classifyVehicle(raw){
  // raw: {kenteken, merk, handelsbenaming, datum_eerste_toelating, datum_tenaamstelling,
  //       datum_eerste_afgifte_nederland, brandstof_omschrijving, brandstofTypes, massa_rijklaar,
  //       voertuigsoort}. brandstofTypes (array, live-only) = echte RDW-brandstofregels per
  //       kenteken; brandstof_omschrijving (string, demodata-only) is de oude tekst-fallback.
  const cls = classifyByModel(raw.merk, raw.handelsbenaming);
  const eersteToelating = parseRdwDate(raw.datum_eerste_toelating);
  const tenaamstelling = parseRdwDate(raw.datum_tenaamstelling);
  const eersteAfgifteNL = parseRdwDate(raw.datum_eerste_afgifte_nederland) || tenaamstelling;
  const age = ageFromDate(eersteToelating);
  const electric = detectElectric(cls.canonicalBrand, raw.handelsbenaming, raw.brandstof_omschrijving, raw.brandstofTypes);
  // mogelijke gebruikte import: eerste toelating ligt >12 mnd vóór eerste registratie NL
  let possibleImport = false;
  if(eersteToelating && eersteAfgifteNL){
    const gap = monthsBetween(eersteToelating, eersteAfgifteNL);
    if(gap!=null && gap >= 12) possibleImport = true;
  }
  return {
    kenteken: (raw.kenteken||"").toUpperCase(),
    merkRdw: normalizeText(raw.merk),
    brandId: cls.brandId,
    handelsbenaming: raw.handelsbenaming || "",
    model: raw.handelsbenaming || "",
    productgroep: cls.productgroep,
    subcategorie: cls.matched || "",
    status: cls.status, // "SMT" | "Concurrent" | "Onbekend"
    confidence: cls.confidence, // "Hoog" | "Middel" | "Laag"
    eersteToelating, tenaamstelling, eersteAfgifteNL,
    leeftijd: age,
    leeftijdscategorie: ageBucketOf(age),
    brandstof: (Array.isArray(raw.brandstofTypes) && raw.brandstofTypes.length) ? raw.brandstofTypes.join(" + ") : (raw.brandstof_omschrijving || "Onbekend"),
    elektrisch: electric,
    // RDW vult "massa_rijklaar" (bedoeld voor auto's/trucks) bij zelfrijdend
    // materieel vaak niet in — voor voertuigcategorie "U" (mobiele machines)
    // gebruikt RDW in plaats daarvan "massa_bedrijfsklaar_maximaal" (bevestigd:
    // 194/194 anders-lege Volvo-mobiele-machines hadden dit veld wél gevuld).
    // Dat is ook wat de RDW-kentekencheck-website toont als "massa rijklaar
    // (technische massa)" wanneer het primaire veld ontbreekt.
    massa: raw.massa_rijklaar ? +raw.massa_rijklaar : (raw.massa_bedrijfsklaar_maximaal ? +raw.massa_bedrijfsklaar_maximaal : null),
    massaBron: raw.massa_rijklaar ? "massa_rijklaar" : (raw.massa_bedrijfsklaar_maximaal ? "massa_bedrijfsklaar_maximaal" : null),
    voertuigsoort: raw.voertuigsoort || "",
    possibleImport,
    jaar: yearOf(eersteToelating),
    maand: monthKey(eersteToelating),
    kwartaal: eersteToelating ? (yearOf(eersteToelating)+" K"+quarterOf(eersteToelating)) : null,
  };
}

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

    const groupNames = Object.keys(cfg.groups);
    const total = Math.round((BRAND_WEIGHT[brand.id]||3) * 9 * (0.85+rnd()*0.3));
    for(let i=0;i<total;i++){
      const groep = groupNames[Math.floor(rnd()*groupNames.length)];
      const models = cfg.groups[groep];
      const model = models[Math.floor(rnd()*models.length)];
      // leeftijdsverdeling: meer recente jaren, langstaart naar oud (realistisch machinepark)
      const ageRoll = rnd();
      let ageYears;
      if(ageRoll<0.30) ageYears = rnd()*3;
      else if(ageRoll<0.55) ageYears = 3+rnd()*3;
      else if(ageRoll<0.75) ageYears = 6+rnd()*3;
      else if(ageRoll<0.88) ageYears = 9+rnd()*3;
      else if(ageRoll<0.95) ageYears = 12+rnd()*3;
      else ageYears = 15+rnd()*8;
      const eersteToelating = new Date(now.getTime() - ageYears*365.25*86400000 - rnd()*30*86400000);
      // tenaamstelling meestal vlak na toelating; ~9% duidelijke import-vertraging
      let tenaamDelayDays = rnd()*40;
      const isImport = rnd()<0.09;
      if(isImport) tenaamDelayDays = 380 + rnd()*900;
      const tenaamstelling = new Date(eersteToelating.getTime() + tenaamDelayDays*86400000);
      const isElecModel = /ELECTRIC|E-SERIES|EQ\b/i.test(model);
      let elektrisch = "Nee", brandstof = "Diesel";
      const elecBoost = (brand.id==="VOLVO_CE"||brand.id==="SENNEBOGEN") ? 0.02 : 0.008;
      const elecChance = isElecModel ? 0.9 : elecBoost * Math.max(0,(now.getFullYear()-eersteToelating.getFullYear()<3?2.4:0.4));
      const er = rnd();
      if(er < elecChance){ elektrisch="Ja"; brandstof="Elektrisch"; }
      else if(er < elecChance+0.02){ elektrisch="Hybride"; brandstof="Hybride (Diesel/Elektrisch)"; }
      else if(rnd()<0.05){ elektrisch="Onbekend"; brandstof="Onbekend"; }
      const massa = Math.round((3500 + rnd()*38000)/50)*50;
      records.push(classifyVehicle({
        kenteken: demoKenteken(rnd, idx++),
        merk: brand.aliases[0],
        handelsbenaming: model,
        datum_eerste_toelating: eersteToelating.toISOString().slice(0,10).replace(/-/g,""),
        datum_tenaamstelling: tenaamstelling.toISOString().slice(0,10).replace(/-/g,""),
        datum_eerste_afgifte_nederland: isImport ? tenaamstelling.toISOString().slice(0,10).replace(/-/g,"") : eersteToelating.toISOString().slice(0,10).replace(/-/g,""),
        brandstof_omschrijving: brandstof,
        massa_rijklaar: rnd()<0.12 ? null : massa,
        voertuigsoort: "Motorrijtuig met beperkte snelheid",
      }));
    }
  });
  // enkele "nog niet in bibliotheek" modellen injecteren t.b.v. sectie 17 (nieuw gesignaleerd)
  const ghostBrands = [["CATERPILLAR","M323F"],["LIEBHERR","R9100"],["KOMATSU","PC128"]];
  ghostBrands.forEach(([merk,model],gi)=>{
    for(let i=0;i<(2+gi);i++){
      const eersteToelating = new Date(now.getTime() - rnd()*400*86400000);
      records.push(classifyVehicle({
        kenteken: demoKenteken(rnd, idx++),
        merk, handelsbenaming: model,
        datum_eerste_toelating: eersteToelating.toISOString().slice(0,10).replace(/-/g,""),
        datum_tenaamstelling: eersteToelating.toISOString().slice(0,10).replace(/-/g,""),
        brandstof_omschrijving:"Diesel", massa_rijklaar: 9000, voertuigsoort:"Motorrijtuig met beperkte snelheid",
      }));
    }
  });
  // dubbele registratie simuleren + dedupe-test (wordt door dedupeRecords opgeruimd)
  if(records.length){ records.push(Object.assign({},records[0])); }
  DEMO_CACHE = dedupeRecords(records);
  return DEMO_CACHE;
}
function dedupeRecords(records){
  const seen = new Set(); const out = [];
  for(const r of records){
    const key = r.kenteken || (r.merkRdw+"|"+r.handelsbenaming+"|"+ (r.eersteToelating? r.eersteToelating.getTime():""));
    if(seen.has(key)) continue;
    seen.add(key); out.push(r);
  }
  return out;
}

/* =====================================================================
   Sectie 5: RDW live API-laag
   Gerichte queries per merk (nooit alle voertuigen tegelijk). Bouwt
   SoQL-parameters op basis van een whitelist, met limiet, timeout,
   dedupe en foutafhandeling.
   ===================================================================== */
// RDW's "merk"-filter omvat bij fabrikanten die ook auto's/trucks bouwen (Volvo, Hyundai,
// Liebherr, Case, JCB e.a.) het VOLLEDIGE wagenpark van dat merk. Personenauto's/bedrijfsauto's
// registreren véél vaker dan bouwmachines, dus "nieuwste 1000" bestaat bijna uitsluitend uit
// auto's — bouwmachines komen er nooit doorheen. Daarom filteren we server-side op de RDW
// voertuigsoort-categorieën waarin materieel daadwerkelijk voorkomt. Let op: "Land- of
// bosbouwtrekker" klinkt als landbouwtractor, maar RDW plaatst hier ook een groot deel van de
// wielladers, verreikers, kniklaadschoppen en mobiele kranen onder — bevestigd via steekproef
// (o.a. Liebherr L506-L514/A312-A916, Komatsu WA-serie, JCB verreikers/graaflaadmachines, Case
// shovels, Volvo L180H/L220H kwamen hier ALLEEN onder deze categorie voorbij, niet onder Mobiele
// machine). Zonder deze categorie werd materieel van bijna elk concurrentmerk stelselmatig
// onderschat (bij Caterpillar bv. 535 registraties, +17,5%). Personenauto/Bedrijfsauto/Bus/
// aanhangwagens blijven wél uitgesloten (dat zijn bij Volvo/Hyundai/Liebherr echt auto's/trucks/
// mobiele kranen buiten de scope van de classificatiemodule).
const RELEVANT_VOERTUIGSOORTEN = ["Mobiele machine","Motorrijtuig met beperkte snelheid","Land- of bosbouwtrekker"];

function buildRdwQuery(opts){
  opts = opts || {};
  const params = new URLSearchParams();
  if(opts.merk && ALLOWED_QUERY_FIELDS.has("merk")){
    // SoQL: enkel toegestane, ge-escapete waarde — geen vrije user-SoQL
    const safe = String(opts.merk).toUpperCase().replace(/[^A-Z0-9 \-]/g,"");
    params.set("merk", safe);
  }
  if(opts.voertuigsoorten && opts.voertuigsoorten.length && ALLOWED_QUERY_FIELDS.has("voertuigsoort")){
    // Waarden komen altijd uit de vaste RELEVANT_VOERTUIGSOORTEN-constante, nooit uit vrije
    // tekstinvoer — apostrofs worden alsnog verwijderd als extra voorzorg tegen SoQL-injectie.
    const clause = opts.voertuigsoorten.map(v=> "'"+String(v).replace(/'/g,"")+"'").join(",");
    params.set("$where", "voertuigsoort in("+clause+")");
  }
  params.set("$limit", String(Math.min(opts.limit||1000, 2000)));
  if(opts.offset) params.set("$offset", String(opts.offset|0));
  const order = opts.order && /^[a-z_]+ (ASC|DESC)$/i.test(opts.order) ? opts.order : "datum_eerste_toelating DESC";
  params.set("$order", order);
  return RDW_BASE + "?" + params.toString();
}
async function fetchRdwPage(rdwMerk, limit, offset, timeoutMs){
  const url = buildRdwQuery({ merk: rdwMerk, voertuigsoorten: RELEVANT_VOERTUIGSOORTEN, limit, offset, order:"datum_eerste_toelating DESC" });
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), timeoutMs||9000);
  const startedAt = performance.now();
  try{
    const res = await fetch(url, { signal: controller.signal, headers:{ "Accept":"application/json" } });
    clearTimeout(timeout);
    const ms = Math.round(performance.now()-startedAt);
    if(!res.ok) return { ok:false, url, ms, error: "HTTP "+res.status+" "+res.statusText, json:null };
    const json = await res.json();
    if(!Array.isArray(json)) return { ok:false, url, ms, error:"Onverwacht antwoordformaat", json:null };
    return { ok:true, url, ms, error:null, json };
  }catch(e){
    clearTimeout(timeout);
    const ms = Math.round(performance.now()-startedAt);
    let msg = e && e.name==="AbortError" ? "Timeout — geen antwoord binnen "+(timeoutMs||9000)+"ms" : (e && e.message ? e.message : "Onbekende netwerkfout");
    if(/Failed to fetch|NetworkError|CORS|blocked/i.test(msg)) msg += " (mogelijk geblokkeerd door CORS/CSP binnen deze omgeving)";
    return { ok:false, url, ms, error: msg, json:null };
  }
}
// RDW's hoofddataset (m9d7-ebf2) heeft GEEN brandstof-kolom — brandstoftype leeft in een
// los dataset (Gekentekende_voertuigen_brandstof, 8ys7-d773) en moet per kenteken gekoppeld
// worden. Zonder deze koppeling is elektrisch/hybride-detectie giswerk op de modelnaam-tekst.
// Eén kenteken kan meerdere brandstofregels hebben (brandstof_volgnummer 1,2,...) — bv. bij
// hybrides — dus we bewaren alle gevonden brandstoftypes per kenteken, niet slechts één.
async function fetchFuelTypes(kentekens){
  const map = new Map();
  const chunkSize = 500;
  for(let i=0;i<kentekens.length;i+=chunkSize){
    const batch = kentekens.slice(i, i+chunkSize);
    const clause = batch.map(k=> "'"+String(k).toUpperCase().replace(/[^A-Z0-9]/g,"")+"'").join(",");
    const url = RDW_FUEL_BASE + "?" + new URLSearchParams({
      "$where": "kenteken in("+clause+")",
      "$select": "kenteken,brandstof_omschrijving",
      "$limit": String(batch.length*3),
    }).toString();
    try{
      const res = await fetch(url, { headers:{ "Accept":"application/json" } });
      if(!res.ok) continue; // brandstofdata is aanvullend — bij falen valt classificatie terug op tekstheuristiek
      const rows = await res.json();
      if(!Array.isArray(rows)) continue;
      for(const row of rows){
        if(!row.kenteken || !row.brandstof_omschrijving) continue;
        const k = row.kenteken.toUpperCase();
        if(!map.has(k)) map.set(k, []);
        map.get(k).push(row.brandstof_omschrijving);
      }
    }catch(e){ /* aanvullende data — brand-fetch mag hier niet op stranden */ }
  }
  return map;
}
async function fetchRdwBrand(rdwMerk, opts){
  opts = opts || {};
  const pageSize = 1000;
  const maxRecords = opts.maxRecords || 20000; // veiligheidslimiet, ruim boven elk merk se werkelijke aantal
  let offset = 0, totalMs = 0, firstUrl = null, raw10 = null, allJson = [];
  while(true){
    const page = await fetchRdwPage(rdwMerk, pageSize, offset, opts.timeoutMs);
    if(firstUrl===null) firstUrl = page.url;
    totalMs += page.ms;
    if(!page.ok){
      if(allJson.length) break; // toon wat al binnen is; latere pagina's mislukten
      return { ok:false, url:page.url, ms:totalMs, error:page.error, records:[] };
    }
    if(raw10===null) raw10 = page.json.slice(0,10).map(r=>r.handelsbenaming||"—");
    if(page.json.length===0) break;
    allJson = allJson.concat(page.json);
    if(page.json.length < pageSize) break; // laatste pagina bereikt
    offset += pageSize;
    if(offset >= maxRecords) break;
  }
  if(allJson.length===0) return { ok:true, url:firstUrl, ms:totalMs, error:null, records:[], empty:true };
  const fuelMap = await fetchFuelTypes(allJson.map(r=>r.kenteken).filter(Boolean));
  const classified = dedupeRecords(allJson.map(r=> classifyVehicle({
    kenteken:r.kenteken, merk:r.merk, handelsbenaming:r.handelsbenaming,
    datum_eerste_toelating:r.datum_eerste_toelating, datum_tenaamstelling:r.datum_tenaamstelling,
    datum_eerste_afgifte_nederland:r.datum_eerste_afgifte_nederland,
    brandstofTypes: r.kenteken ? fuelMap.get(String(r.kenteken).toUpperCase()) : undefined,
    massa_rijklaar:r.massa_rijklaar, massa_bedrijfsklaar_maximaal:r.massa_bedrijfsklaar_maximaal, voertuigsoort:r.voertuigsoort,
  })));
  return { ok:true, url:firstUrl, ms:totalMs, error:null, records:classified, raw10, count:allJson.length };
}
// Sommige merken hebben meerdere RDW-schrijfwijzen (bv. Fuchs: FUCHS +
// TEREX-FUCHS + "TEREX FUCHS"; Giant: GIANT + TOBROCO) — elke alias moet
// afzonderlijk bij RDW opgevraagd worden (SoQL "merk="-filter is exact),
// resultaten worden hier samengevoegd onder het ene canonieke merk.
async function fetchRdwBrandAllAliases(brand, opts){
  const perAlias = [];
  for(const alias of brand.aliases){
    perAlias.push(Object.assign({ alias }, await fetchRdwBrand(alias, opts)));
  }
  const ok = perAlias.filter(r=>r.ok);
  if(ok.length===0){
    return { ok:false, url:perAlias[0].url, ms:perAlias.reduce((a,r)=>a+r.ms,0), error:perAlias[0].error, records:[] };
  }
  let combined = [];
  ok.forEach(r=>{ if(r.records) combined = combined.concat(r.records); });
  const raw10 = perAlias.find(r=>r.raw10 && r.raw10.length)?.raw10 || [];
  return {
    ok:true,
    url: perAlias.map(r=>r.url).join(" | "),
    ms: perAlias.reduce((a,r)=>a+r.ms,0),
    error: ok.length<perAlias.length ? "Sommige merk-aliases konden niet worden opgehaald ("+ok.length+"/"+perAlias.length+" gelukt)." : null,
    records: dedupeRecords(combined),
    raw10,
    count: perAlias.reduce((a,r)=>a+(r.count||0),0),
  };
}
async function fetchAllActiveLive(activeBrands, onProgress){
  const results = [];
  for(const brand of activeBrands){
    const r = await fetchRdwBrandAllAliases(brand, {});
    results.push(Object.assign({ brand }, r));
    if(onProgress) onProgress(brand, r);
  }
  return results;
}

/* =====================================================================
   Sectie 7: filter-engine — centraal toegepast op elke pagina/KPI
   ===================================================================== */
function activeBrandList(){
  return BRANDS.filter(b=> b.group==="SMT" || STATE.settings.competitorActive[b.id]!==false);
}
function inPeriode(rec, preset){
  if(!rec.eersteToelating) return preset==="alle";
  const now = new Date();
  if(preset==="alle") return true;
  if(preset==="1m"){ const d=new Date(now); d.setUTCMonth(d.getUTCMonth()-1); return rec.eersteToelating>=d; }
  if(preset==="12m"){ const d=new Date(now); d.setUTCMonth(d.getUTCMonth()-12); return rec.eersteToelating>=d; }
  if(preset==="ytd"){ return rec.eersteToelating.getUTCFullYear()===now.getUTCFullYear(); }
  if(preset==="vorigjaar"){ return rec.eersteToelating.getUTCFullYear()===now.getUTCFullYear()-1; }
  return true;
}
function applyFilters(records, f){
  f = f || STATE.filters;
  const activeIds = new Set(activeBrandList().map(b=>b.id));
  return records.filter(r=>{
    if(!r.brandId || !activeIds.has(r.brandId)) return false;
    if(f.periodePreset && f.periodePreset!=="alle" && !inPeriode(r, f.periodePreset)) return false;
    if(f.jaar && f.jaar!=="alle" && String(r.jaar)!==String(f.jaar)) return false;
    if(f.merkIds && f.merkIds.length && !f.merkIds.includes(r.brandId)) return false;
    if(f.smtConcurrent && f.smtConcurrent!=="alle" && r.status!==f.smtConcurrent) return false;
    if(f.productgroep && f.productgroep!=="alle" && r.productgroep!==f.productgroep) return false;
    if(f.modelQuery){
      const q = f.modelQuery.toUpperCase();
      if(!(r.handelsbenaming||"").toUpperCase().includes(q)) return false;
    }
    if(f.brandstof && f.brandstof!=="alle" && r.brandstof!==f.brandstof) return false;
    if(f.elektrisch && f.elektrisch!=="alle" && r.elektrisch!==f.elektrisch) return false;
    if(f.leeftijdscategorie && f.leeftijdscategorie!=="alle" && r.leeftijdscategorie!==f.leeftijdscategorie) return false;
    if(f.betrouwbaarheid && f.betrouwbaarheid!=="alle" && r.confidence!==f.betrouwbaarheid) return false;
    return true;
  });
}
function clearFilters(){
  STATE.filters = { periodePreset:"alle", jaar:"alle", merkIds:[], smtConcurrent:"alle", productgroep:"alle", modelQuery:"", brandstof:"alle", elektrisch:"alle", leeftijdscategorie:"alle", betrouwbaarheid:"alle" };
}
function activeFilterCount(){

  if(f.jaar!=="alle") n++;

  if(f.leeftijdscategorie!=="alle") n++;
  if(f.betrouwbaarheid!=="alle") n++;
  return n;
}

/* =====================================================================
   Sectie 8: format helpers
   ===================================================================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtNum(n){ return n==null || isNaN(n) ? "—" : Math.round(n).toLocaleString("nl-NL"); }
function fmtDec(n,d){ return n==null || isNaN(n) ? "—" : n.toLocaleString("nl-NL",{minimumFractionDigits:d||1,maximumFractionDigits:d||1}); }
function fmtPct(n,d){ return n==null || isNaN(n) ? "—" : n.toLocaleString("nl-NL",{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})+"%"; }
function fmtDelta(cur, prev){
  if(prev==null || cur==null || prev===0) return { text:"—", dir:"flat" };
  // te kleine datasets leveren geen betrouwbare conclusie op (sectie 33)
  if(cur+prev < 10) return { text:"Te weinig data", dir:"flat" };
  const pct = ((cur-prev)/prev)*100;
  const dir = pct>0.5?"up":pct<-0.5?"down":"flat";
  const arrow = dir==="up"?"↑":dir==="down"?"↓":"→";
  return { text: arrow+" "+fmtPct(Math.abs(pct),1), dir, pct };
}
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function groupBy(arr, fn){
  const m = new Map();
  for(const item of arr){ const k = fn(item); if(!m.has(k)) m.set(k,[]); m.get(k).push(item); }
  return m;
}
function downloadBlob(filename, content, mime){
  const blob = new Blob([content], { type: mime||"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportCSV(records, filename){
  const cols = ["Kenteken","Merk","Model","Productgroep","Eerste toelating","Leeftijd","Brandstof","Elektrisch","Eigen merk/concurrent"];
  const rows = records.map(r=>[
    r.kenteken, brandById(r.brandId)?brandById(r.brandId).label:r.merkRdw, r.handelsbenaming, r.productgroep,
    r.eersteToelating?formatDateNL(r.eersteToelating,true):"", r.leeftijd==null?"":r.leeftijd, r.brandstof, r.elektrisch, r.status
  ]);
  const esc2 = v => { const s=String(v==null?"":v); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [cols.join(";")].concat(rows.map(r=>r.map(esc2).join(";"))).join("\r\n");
  downloadBlob(filename||"smt-export.csv", "﻿"+csv);
}

let TOOLTIP_WIRED = false;
function wireTooltips(){
  if(TOOLTIP_WIRED) return; TOOLTIP_WIRED = true;
  const root = document.getElementById("tooltip-root");
  document.addEventListener("mousemove", e=>{
    const el = e.target.closest && e.target.closest("[data-tip]");
    if(!el){ root.innerHTML=""; return; }
    const tip = el.getAttribute("data-tip");
    root.innerHTML = '<div class="viz-tooltip" style="left:'+(e.clientX+14)+'px; top:'+(e.clientY+14)+'px;">'+tip+'</div>';
  });
  document.addEventListener("mouseleave", ()=>{ root.innerHTML=""; }, true);
}
function chartColorVar(id){
  const idx = SERIES_COLORS_ORDER.indexOf(id);
  return idx>=0 ? "var(--"+SERIES_COLORS[idx]+")" : "var(--s-other)";
}
const SERIES_COLORS_ORDER = []; // wordt per chart lokaal ingevuld

function legendHtml(items, offSet, toggleAttr){
  return '<div class="legend">'+items.map(it=>{
    const off = offSet && offSet.has(it.id);
    // Gestreepte reeksen krijgen een gestreepte lijn-swatch i.p.v. een vol
    // blokje, zodat de legenda dezelfde solid/dashed-onderscheiding toont
    // als de grafiek zelf (nooit kleur als enige identiteitsdrager).
    const swatch = it.dashed
      ? '<svg class="legend-swatch" style="width:16px;height:10px;border-radius:0;" viewBox="0 0 16 10"><line x1="0" y1="5" x2="16" y2="5" stroke="'+it.color+'" stroke-width="2.5" stroke-dasharray="3.5,2.5"/></svg>'
      : '<span class="legend-swatch" style="background:'+it.color+'"></span>';
    return '<div class="legend-item'+(off?' off':'')+'" data-'+toggleAttr+'="'+esc(it.id)+'">'+
      swatch+esc(it.label)+'</div>';
  }).join("")+'</div>';
}

// ---- Lijngrafiek (meerdere reeksen, hover crosshair via per-punt tooltip) ----
function lineChart(opts){
  const { xLabels, series, height, valueFmt } = opts; // series: [{id,label,color,values:[num|null]}]
  const W = 720, H = height||260, padL=44, padR=16, padT=14, padB=30;
  const plotW = W-padL-padR, plotW_ = plotW, plotH = H-padT-padB;
  const visible = series.filter(s=>!opts.offSet || !opts.offSet.has(s.id));
  let maxV = 0;
  visible.forEach(s=> s.values.forEach(v=>{ if(v!=null) maxV = Math.max(maxV, v); }));
  maxV = maxV<=0 ? 1 : maxV*1.15;
  const n = xLabels.length;
  const xAt = i => padL + (n<=1?0:(i/(n-1))*plotW_);
  const yAt = v => padT + plotH - (v/maxV)*plotH;
  const gridN = 4;
  let gridLines = "";
  for(let g=0; g<=gridN; g++){
    const v = (maxV/gridN)*g; const y = yAt(v);
    gridLines += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
    gridLines += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--text-muted)">'+fmtNum(v)+'</text>';
  }
  const xTickEvery = Math.max(1, Math.ceil(n/8));
  let xTicks = "";
  xLabels.forEach((lb,i)=>{ if(i%xTickEvery===0 || i===n-1) xTicks += '<text x="'+xAt(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--text-muted)">'+esc(lb)+'</text>'; });
  let paths = "";
  visible.forEach(s=>{
    let d = ""; let dots = "";
    s.values.forEach((v,i)=>{
      if(v==null) return;
      const x=xAt(i), y=yAt(v);
      d += (d===""?"M":"L")+x.toFixed(1)+","+y.toFixed(1)+" ";
      dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.5" fill="'+s.color+'" stroke="var(--surface)" stroke-width="1.5" data-tip="<b>'+esc(s.label)+'</b><br>'+esc(xLabels[i])+': '+(valueFmt?valueFmt(v):fmtNum(v))+'" style="cursor:pointer"/>';
    });
    const dashAttr = s.dash ? ' stroke-dasharray="8,4"' : '';
    paths += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+dashAttr+'/>' + dots;
  });
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:520px;display:block" role="img" aria-label="Lijngrafiek">'+
    gridLines + '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--border-strong)" stroke-width="1"/>' +
    xTicks + paths + '</svg>';
  const legend = legendHtml(series.map(s=>({id:s.id,label:s.label,color:s.color,dashed:s.dash})), opts.offSet, opts.toggleAttr||"toggle-series");
  return '<div class="chart-wrap">'+svg+'</div>'+(series.length>1?legend:"");
}

// ---- Horizontale staafgrafiek ----
function barChartH(items, opts){
  opts = opts||{};
  const max = Math.max(1, ...items.map(i=>i.value));
  const rows = items.map(it=>{
    const pct = (it.value/max)*100;
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;" data-tip="<b>'+esc(it.label)+'</b><br>'+fmtNum(it.value)+(opts.showShare?(' · '+fmtPct(it.share,1)):'')+'">'+
      '<div style="width:118px;font-size:12px;color:var(--text-secondary);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(it.label)+'</div>'+
      '<div style="flex:1;background:var(--grid);border-radius:4px;height:16px;position:relative;overflow:hidden;">'+
        '<div style="width:'+pct.toFixed(1)+'%;background:'+it.color+';height:100%;border-radius:4px;"></div></div>'+
      '<div style="width:64px;flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--text-primary);" class="tabular">'+fmtNum(it.value)+'</div>'+
    '</div>';
  }).join("");
  return '<div>'+rows+'</div>';
}

// ---- Donutgrafiek ----
function donutChart(items, opts){
  opts = opts||{};
  const total = items.reduce((a,b)=>a+b.value,0) || 1;
  const R=60, CX=74, CY=74, STROKE=22;
  const circ = 2*Math.PI*R;
  let offset = 0, arcs = "";
  items.forEach(it=>{
    const frac = it.value/total;
    const len = frac*circ;
    const gap = items.length>1 ? 2 : 0;
    arcs += '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+it.color+'" stroke-width="'+STROKE+'" '+
      'stroke-dasharray="'+Math.max(0,len-gap)+' '+(circ-Math.max(0,len-gap))+'" stroke-dashoffset="'+(-offset)+'" '+
      'transform="rotate(-90 '+CX+' '+CY+')" data-tip="<b>'+esc(it.label)+'</b><br>'+fmtNum(it.value)+' · '+fmtPct(frac*100,1)+'" style="cursor:pointer"/>';
    offset += len;
  });
  const svg = '<svg viewBox="0 0 148 148" width="148" height="148" role="img" aria-label="Donutgrafiek">'+arcs+
    '<text x="74" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text-primary)">'+fmtNum(total)+'</text>'+
    '<text x="74" y="86" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">totaal</text></svg>';
  return '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">'+svg+
    '<div class="legend" style="margin-top:0;flex-direction:column;align-items:flex-start;gap:7px;">'+
    items.map(it=>'<div class="legend-item" data-tip="<b>'+esc(it.label)+'</b><br>'+fmtNum(it.value)+' · '+fmtPct((it.value/total)*100,1)+'"><span class="legend-swatch" style="background:'+it.color+'"></span>'+esc(it.label)+' <b class="tabular" style="color:var(--text-primary)">'+fmtPct((it.value/total)*100,1)+'</b></div>').join("")+
    '</div></div>';
}

// ---- Gestapelde staafgrafiek (leeftijdsopbouw per merk) ----
function stackedBarChart(categories, series, opts){
  // categories: [labels]; series: [{id,label,color,values:[per categorie]}]
  opts = opts||{};
  const totals = categories.map((_,ci)=> series.reduce((a,s)=>a+(s.values[ci]||0),0));
  const max = Math.max(1,...totals);
  const W=720, H=opts.height||220, padL=40, padR=16, padT=10, padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const bw = plotW/categories.length;
  let bars="";
  categories.forEach((cat,ci)=>{
    let y = H-padB;
    const total = totals[ci];
    series.forEach(s=>{
      const v = s.values[ci]||0;
      if(v<=0) return;
      const h = (v/max)*plotH;
      const x = padL + ci*bw + bw*0.14;
      y -= h;
      bars += '<rect x="'+x.toFixed(1)+'" y="'+(y+1).toFixed(1)+'" width="'+(bw*0.72).toFixed(1)+'" height="'+Math.max(0,h-1.5).toFixed(1)+'" fill="'+s.color+'" rx="2" data-tip="<b>'+esc(s.label)+'</b><br>'+esc(cat)+': '+fmtNum(v)+'"/>';
    });
    bars += '<text x="'+(padL+ci*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--text-muted)">'+esc(cat)+'</text>';
    bars += '<text x="'+(padL+ci*bw+bw/2)+'" y="'+(H-padB-((total/max)*plotH)-6)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-secondary)">'+(total>0?fmtNum(total):"")+'</text>';
  });
  const gridN=4; let grid="";
  for(let g=0; g<=gridN; g++){ const v=(max/gridN)*g; const y=H-padB-(v/max)*plotH;
    grid += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)"/>'+
      '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--text-muted)">'+fmtNum(v)+'</text>'; }
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:520px;display:block">'+grid+
    '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--border-strong)"/>'+bars+'</svg>';
  return '<div class="chart-wrap">'+svg+'</div>'+(series.length>1?legendHtml(series,opts.offSet,opts.toggleAttr||"toggle-series"):"");
}
